<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14307f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>SenAfterPay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne mobile, barre d'onglets en bas, feuilles modales plein écran pour les saisies. */
:root{
  --bg:#f2f3f9; --card:#ffffff; --ink:#111a3a; --mute:#5a6486; --line:#dfe2ee;
  --accent:#14307f; --accent-ink:#ffffff; --accent-soft:#e4e9f8;
  --gold:#f2a900; --gold-soft:#fdf0cc; --violet:#6a1bd6;
  --ok:#1b7f4b; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbefd2; --bad:#b4281f; --bad-soft:#fbe0dd;
  --shadow:0 1px 2px rgba(17,26,58,.06),0 4px 14px rgba(17,26,58,.06);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f20; --card:#141a33; --ink:#e9ecf8; --mute:#9aa3c4; --line:#262f50;
  --accent:#9bb0ff; --accent-ink:#0b1230; --accent-soft:#1c2650; --gold:#f5b82e; --gold-soft:#3a2d0c; --violet:#b48cff;
  --ok:#5fd193; --ok-soft:#163626; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8b80; --bad-soft:#3d1c19; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f20; --card:#141a33; --ink:#e9ecf8; --mute:#9aa3c4; --line:#262f50;
  --accent:#9bb0ff; --accent-ink:#0b1230; --accent-soft:#1c2650; --gold:#f5b82e; --gold-soft:#3a2d0c; --violet:#b48cff;
  --ok:#5fd193; --ok-soft:#163626; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8b80; --bad-soft:#3d1c19; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-block:0 92px;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:#fff;border-bottom:3px solid var(--gold);box-shadow:var(--shadow)}
.hd-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0} .brand img{height:40px;width:auto;flex:none}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;color:#0f2a6b} .brand b i{font-style:normal;color:#e69a00} .brand b u{text-decoration:none;color:#6a1bd6}
.brand small{display:block;font:500 10.5px var(--f-body);color:#5a6486;letter-spacing:.03em;margin-top:3px;white-space:nowrap}
.who{font-size:12px;color:#5a6486;text-align:right;flex:none;line-height:1.5}
.who .badge{background:#e4e9f8;color:#14307f}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:600 10.5px var(--f-body);padding:8px 1px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)} .tabs button[aria-selected="true"] svg{stroke:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin-block:18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:17px;color:var(--ink)} .sec span{font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 19px var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute)} .kpi.alert b{color:var(--bad)} .kpi.big{grid-column:1/-1;background:linear-gradient(120deg,#14307f 0%,#4b1fb8 100%);color:#fff;border:0}
.kpi.big span{color:#fff;opacity:.85} .kpi.big b{font-size:28px;color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;min-width:0}
.row .l{min-width:0} .row .l b{display:block;overflow-wrap:anywhere} .row .l small{color:var(--mute);display:block}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .r b{display:block}
.dc{display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.mh{margin:34px 0 4px;padding:13px 16px;border-radius:12px;background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mh span{font:800 20px var(--f-body)}.mh small{font:700 13px var(--f-body);opacity:.92}
.acts a,.acts button{flex:1;min-width:76px;border:0;cursor:pointer;text-align:center;text-decoration:none;padding:10px 8px;border-radius:10px;font:700 13px var(--f-body);background:var(--accent-soft);color:var(--accent)}
.acts a.wa,.acts button.wa{background:var(--ok-soft);color:var(--ok)}
.chart{width:100%;height:auto;display:block} .chart text{fill:var(--mute);font:11px var(--f-body)} .chart .bar-r{fill:var(--accent)} .chart line{stroke:var(--line)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.menu .row{padding:14px}
.menu .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-right:12px}
.menu .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi small{display:block;font-size:11px;color:var(--mute);margin-top:2px} .kpi.big small{color:#fff;opacity:.8}
.kpi.good b{color:var(--ok)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--mute)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);padding:13px 16px;border-radius:12px;cursor:pointer;width:100%}
.btn.sec2{background:var(--accent-soft);color:var(--accent)} .btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.fab{background:var(--gold);color:#2b1d00;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5;border-radius:99px;padding:13px 20px}
input,select{font:16px var(--f-body);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid2>*{min-width:0}
.search{margin-block:4px 10px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-bottom:30px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet header h2{font-size:20px} .x{border:0;background:var(--card);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .tbl th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tbl td.n,.tbl th.n{text-align:right}
.scroll{overflow-x:auto}
.line-item{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:600 14px var(--f-body);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums} .tot.g{font:700 18px var(--f-display);border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:90vw}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.receipt{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:16px}
.receipt .cbox{background:#f4f6fb;border-radius:8px;padding:8px 10px;margin:10px 0}.receipt .big{font-size:17px;color:#14307f}.receipt .sigs{display:flex;gap:12px;margin-top:24px}.receipt .sigs div{flex:1;border-top:1px solid #999;padding-top:4px;text-align:center;font-size:11px;color:#555}.receipt .foot{margin:12px 0 0;text-align:center;font-size:11px;color:#555}.receipt .tot{color:#111}
.receipt .lg{display:block;height:auto;max-height:64px;max-width:100%;width:auto;margin:0 auto 6px} .receipt .tag{display:block;text-align:center;color:#5a6486;font-size:11px;letter-spacing:.06em;text-transform:uppercase} .receipt small{color:#555}
.receipt .tbl td,.receipt .tbl th{border-color:#ddd;color:#111} .receipt .tbl th{color:#555}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:0}}}
.tk-av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #14307f;overflow:hidden;background:var(--accent-soft);flex:none;color:var(--accent)}
.tk-av img{width:100%;height:100%;object-fit:cover}.tk-av b{font:700 14px var(--f-body)}
.tk-pill{display:inline-block;color:#fff;font:700 12px var(--f-body);padding:3px 9px;border-radius:99px;margin:3px 0}
.tk-map{height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:10px;z-index:0}
.tk-flt{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tk-flt select{grid-column:1/3}.tk-flt select,.tk-flt input{min-width:0;font-size:14px}
.tk-card{margin-top:10px;cursor:pointer}.tk-g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;text-align:center}
.tk-g b{display:block;font:700 14px var(--f-body)}.tk-g span{font-size:11px;color:var(--mute)}
.tk-st{font:700 16px var(--f-body);color:var(--mute)}.tk-st.on{color:var(--ok)}
.tk-pin{width:46px;height:46px;border-radius:50%;border:4px solid #14307f;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tk-pin img{width:100%;height:100%;object-fit:cover}.tk-pin.old{opacity:.6;border-style:dashed}
.tk-nm{position:absolute;left:50%;top:48px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);padding:1px 6px;border-radius:6px;font:700 11px system-ui;text-align:center}
.tk-cl{width:22px;height:22px;border-radius:5px;color:#fff;font:700 14px/22px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.tk-stop{background:#b4281f;color:#fff;border-radius:99px;font:700 11px/22px system-ui;text-align:center;border:2px solid #fff;opacity:.85}.tk-stop.live{opacity:1;animation:tkp 1.4s infinite}
@keyframes tkp{50%{box-shadow:0 0 0 8px rgba(180,40,31,.25)}}
.tk-al{border-left:4px solid var(--bad)}
</style>

/* SenAfterPay autonome : remplace la plateforme Claude par Supabase (connexion, base de données, téléchargements). */
window.SAP_STANDALONE=true;
window.SAP_LIBS={h2c:'html2canvas.min.js',pdf:'jspdf.umd.min.js'};
(function(){
  const CFG=window.SAP_CONFIG||{};
  const configured=CFG.url&&CFG.key&&!/VOTRE/i.test(CFG.url+CFG.key);
  let sb=null,session=null,profile=null;
  const $=s=>document.querySelector(s);
  const LSQ='sap_queue',LSC='sap_cache_';
  const cache={},subs={};   // cache[col]=Map(id->data)
  window.SAP_Q=()=>queue.length;
  let queue=[];try{queue=JSON.parse(localStorage.getItem(LSQ)||'[]')}catch(e){}
  const saveQ=()=>{try{localStorage.setItem(LSQ,JSON.stringify(queue))}catch(e){}};
  const saveC=c=>{try{localStorage.setItem(LSC+c,JSON.stringify([...cache[c]]))}catch(e){}};
  const loadC=c=>{try{return new Map(JSON.parse(localStorage.getItem(LSC+c)||'[]'))}catch(e){return new Map()}};
  function emit(c){(subs[c]||[]).forEach(cb=>cb({docs:[...cache[c]].map(([id,d])=>({id,data:()=>d}))}))}
  function banner(t){let b=$('#sapNet');if(!t){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='sapNet';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#f2a900;color:#14307f;font:600 12px system-ui;text-align:center;padding:4px';document.body.appendChild(b)}b.textContent=t}
  const isNetErr=e=>!e||/fetch|network|failed|load/i.test(String(e.message||e))||e.code==='';

  function loginUI(msg){
    return new Promise(res=>{
      let o=$('#sapLogin');if(o)o.remove();
      o=document.createElement('div');o.id='sapLogin';
      o.innerHTML='<form class="lg-card" autocomplete="on"><img src="'+(window.SAP_EMBLEM||'')+'" alt="" width="72" height="72"><h1>Sen<i>After</i><u>Pay</u></h1><p>Achetez aujourd\'hui, payez après.</p>'+
        (configured?'<label for="lgE">E-mail</label><input id="lgE" type="email" autocomplete="username" required><label for="lgP">Mot de passe</label><input id="lgP" type="password" autocomplete="current-password" required><p id="lgM" class="lg-m"></p><button class="btn" type="submit">Se connecter</button>':
        '<p class="lg-m">L\'application n\'est pas encore reliée à sa base de données. Ouvrez le fichier <b>config.js</b> et renseignez l\'adresse et la clé de votre projet Supabase.</p>')+'</form>';
      document.body.appendChild(o);
      if(msg)$('#lgM')&&($('#lgM').textContent=msg);
      const f=o.querySelector('form');
      f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;$('#lgM').textContent='';
        const{data,error}=await sb.auth.signInWithPassword({email:$('#lgE').value.trim(),password:$('#lgP').value});
        b.disabled=false;
        if(error){$('#lgM').textContent=/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+error.message;return}
        session=data.session;o.remove();res()};
    });
  }
  async function ensureSession(){
    if(!configured){await loginUI();return new Promise(()=>{})}
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
    try{const{data}=await sb.auth.getSession();session=data.session}catch(e){}
    if(!session){
      // hors connexion avec un accès déjà utilisé : on laisse ouvrir en lecture
      await loginUI();
    }
    try{const{data}=await sb.from('profiles').select('id,name,role,active').eq('id',session.user.id).maybeSingle();profile=data||{id:session.user.id,name:'',role:'agent'}}
    catch(e){profile={id:session.user.id,name:'',role:'agent'}}
    try{const p=JSON.parse(localStorage.getItem('sap_profile')||'null');if(p&&p.id===session.user.id&&!profile.role)profile=p}catch(e){}
    try{localStorage.setItem('sap_profile',JSON.stringify(profile))}catch(e){}
  }
  let sessionP=null;const sess=()=>sessionP||(sessionP=ensureSession().then(()=>{if(profile&&profile.active===false)blockUI();else checkActive()}));

  async function flush(){
    if(!sb||!queue.length)return;
    const rest=[];
    for(const q of queue){
      try{const{error}=await sb.from('docs').upsert({col:q.c,id:q.id,data:q.data,updated_at:new Date().toISOString()});if(error)throw error}
      catch(e){if(isNetErr(e)){rest.push(q);rest.push(...queue.slice(queue.indexOf(q)+1));break}else{console.warn('rejeté',q.c,q.id,e.message);checkActive()}}
    }
    queue=rest;saveQ();banner(queue.length?queue.length+' opération(s) en attente de connexion':'');
  }
  let blocked=false;
  function blockUI(){
    if(blocked)return;blocked=true;
    const o=document.createElement('div');o.id='sapBlock';o.style.cssText='position:fixed;inset:0;z-index:200;background:#14307f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font:16px system-ui';
    o.innerHTML='<h1 style="margin:0 0 12px;font-size:22px">Compte désactivé</h1><p style="max-width:320px;margin:0 0 20px">Votre accès a été arrêté par le directeur. Aucune opération n\'est possible.</p><button style="padding:12px 20px;border:0;border-radius:10px;font-weight:700">Se déconnecter</button>';
    o.querySelector('button').onclick=()=>window.SAP_LOGOUT();document.body.appendChild(o);
  }
  async function checkActive(){
    if(!sb||!session||blocked)return;
    try{const{data,error}=await sb.from('profiles').select('active').eq('id',session.user.id).maybeSingle();if(!error&&data&&data.active===false){profile.active=false;queue=[];saveQ();blockUI()}}catch(e){}
  }
  addEventListener('online',()=>{checkActive();flush()});setInterval(()=>{checkActive();flush()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkActive()});

  async function loadCol(c){
    try{
      let all=[],from=0;
      for(;;){const{data,error}=await sb.from('docs').select('id,data').eq('col',c).range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
      cache[c]=new Map(all.map(r=>[r.id,r.data]));saveC(c);
      // réappliquer ce qui est encore en attente d'envoi
      queue.filter(q=>q.c===c).forEach(q=>cache[c].set(q.id,q.data));
      return true;
    }catch(e){cache[c]=cache[c]||loadC(c);return false}
  }
  let chan=null;
  function listen(){
    if(chan)return;
    chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col&&p.eventType==='DELETE')return;
      const c=(p.new&&p.new.col)||(p.old&&p.old.col);if(!c||!cache[c])return;
      if(p.eventType==='DELETE'){cache[c].delete(p.old.id)}else cache[c].set(p.new.id,p.new.data);
      saveC(c);emit(c);
    }).subscribe();
  }
  const slash=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  function docRef(c,id){
    return{
      async set(obj){
        cache[c]=cache[c]||new Map();cache[c].set(id,obj);saveC(c);emit(c);
        try{const{error}=await sb.from('docs').upsert({col:c,id,data:obj,updated_at:new Date().toISOString()});if(error)throw error}
        catch(e){if(isNetErr(e)){queue=queue.filter(q=>!(q.c===c&&q.id===id));queue.push({c,id,data:obj});saveQ();banner(queue.length+' opération(s) en attente de connexion')}
          else{cache[c].delete(id);saveC(c);emit(c);throw e}}
      },
      async delete(){
        if(cache[c]){cache[c].delete(id);saveC(c);emit(c)}
        const{error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;
      },
      async get(){const{data}=await sb.from('docs').select('data').eq('col',c).eq('id',id).maybeSingle();return{exists:!!data,data:()=>data?data.data:undefined}},
      async acquire({holder}){const{data,error}=await sb.rpc('claim_slot',{p_id:id,p_holder:String(holder)});if(error)throw error;return{acquired:data===true}}
    };
  }
  const DB={
    collection(c){return{
      doc:id=>docRef(c,id),
      onSnapshot(cb,errcb){
        (subs[c]=subs[c]||[]).push(cb);
        (async()=>{await sess();const ok=await loadCol(c);listen();emit(c);if(!ok&&errcb&&!cache[c].size){}})();
        return()=>{subs[c]=subs[c].filter(x=>x!==cb)};
      }}},
    doc(path){const[c,id]=slash(path);return docRef(c,id)}
  };
  const USER={
    async me(){return{id:session.user.id,name:profile.name||session.user.email.split('@')[0]}},
    async canEdit(){return profile.role==='admin'},
    async isOwner(){return profile.role==='admin'},
    async list(){const{data,error}=await sb.from('profiles').select('id,name,role,active,zone').order('name');if(error)throw error;return data||[]},
    async update(id,patch){const{error}=await sb.from('profiles').update(patch).eq('id',id);if(error)throw error},
    async audit(){const{data,error}=await sb.from('audit').select('*').order('at',{ascending:false}).limit(100);if(error)throw error;return data||[]},
    async profiles(ids){
      try{const{data}=await sb.from('profiles').select('id,name').in('id',ids);const o={};(data||[]).forEach(p=>o[p.id]={name:p.name});return o}catch(e){return{}}
    }
  };
  const DL={async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.pdf$/i.test(filename)?'application/pdf':/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{status:'saved'}
  }};
  window.claude={async use(n){
    if(n==='db'){await sess();return DB}
    if(n==='user'){await sess();return USER}
    if(n==='downloads')return DL;

//# sourceMappingURL=leaflet.js.map</script><style media="not all" id="lf-css-x"></style><script type="text/plain" id="lf-css">/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: none;
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: none;
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: none;
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: none;
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;

<script>
(function(){
'use strict';
/* ========= Utilitaires ========= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('fr-FR');
const money=n=>nf.format(Math.round(n||0)).replace(/[  ]/g,' ')+' FCFA';
const pad=(n,l=2)=>String(n).padStart(l,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const fdate=s=>{if(!s)return'';const[y,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+y};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addMonths(s,k){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),Math.min(7000,2400+String(msg).length*40))}

/* ========= Calculs de crédit (fonctions pures, testées) =========
   Le solde n'est jamais stocké : il se recalcule à partir des paiements non annulés. */
function addDays(s,k){const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+k))}
// Échéancier libre : n tranches, 1re date choisie par le dirigeant, puis un pas (mois ou jours) à partir de la 1re.
// step = {m:1} (chaque mois) ou {d:15} (tous les 15 jours). Le reliquat d'arrondi va à la dernière tranche.
function buildSchedule(total,deposit,n,first,step){
  const rest=Math.max(0,Math.round(total)-Math.round(deposit));
  if(!n||rest===0)return[];
  const base=Math.floor(rest/n);const out=[];
  for(let i=0;i<n;i++){
    const due=step&&step.d?addDays(first,i*step.d):addMonths(first,i*((step&&step.m)||1));
    out.push({n:i+1,due,amount:i===n-1?rest-base*(n-1):base});
  }
  return out;
}
// Les versements (hors acompte) remboursent les échéances dans l'ordre, la plus ancienne d'abord.
function allocate(schedule,paidTotal,now){
  let left=paidTotal;
  return schedule.map(e=>{
    const paid=Math.min(e.amount,left);left-=paid;
    const bal=e.amount-paid;
    let st='avenir';
    if(bal===0)st='payee';else if(e.due<now)st='retard';else if(e.due===now)st='aujourdhui';
    return{...e,paid,balance:bal,status:st};
  });
}
function saleState(sale,pays,now){
  const ok=pays.filter(p=>p.saleId===sale.id&&p.status!=='annulé');
  const deposit=ok.filter(p=>p.kind==='acompte'||p.kind==='comptant').reduce((a,p)=>a+p.amount,0);
  const inst=ok.filter(p=>p.kind==='versement').reduce((a,p)=>a+p.amount,0);
  const paid=deposit+inst;
  const sched=allocate(sale.schedule||[],inst,now);
  const balance=Math.max(0,sale.total-paid);
  const late=sched.filter(e=>e.status==='retard').reduce((a,e)=>a+e.balance,0);
  const status=balance===0?'soldée':late>0?'en retard':'en cours';
  return{paid,balance,sched,late,status,overpaid:Math.max(0,paid-sale.total)};
}
window.__calc={buildSchedule,allocate,saleState,addMonths,addDays};

/* ========= Données : base partagée (db) ou, à défaut, stockage local du téléphone ========= */
const COLS=['clients','products','costs','sales','payments','moves','cancels','staff','invoices','slots','expenses','remittances','counts','logs','settings','reminders','tracks','agentinfo'];
const S={clients:[],products:[],costs:[],sales:[],payments:[],moves:[],cancels:[],staff:[],invoices:[],slots:[],expenses:[],remittances:[],counts:[],logs:[],settings:[],reminders:[],tracks:[],agentinfo:[]};
let DB=null,ME={id:null,name:'',isAdmin:false},NAMES={},mode='local',ready=false,tab='home',query='';
const lsGet=c=>{try{return JSON.parse(localStorage.getItem('sap_'+c)||'[]')}catch(e){return[]}};
const lsPut=c=>{try{localStorage.setItem('sap_'+c,JSON.stringify(S[c]))}catch(e){}};
let rt=0;function rerender(){cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{render();if(top_)top_.refresh&&top_.refresh()})}
let top_=null;
async function put(c,id,obj){
  if(DB){await DB.collection(c).doc(id).set(obj)}
  else{const i=S[c].findIndex(x=>x.id===id);const o={id,...obj};if(i>=0)S[c][i]=o;else S[c].push(o);lsPut(c);rerender()}
}
const __put=put;put=async function(c,id,obj){const r=await __put(c,id,obj);try{TRK.onPut(c,id,obj)}catch(e){}return r};
async function init(){
  let user=null;
  try{DB=await claude.use('db');user=await claude.use('user')}catch(e){DB=null}
  if(user){
    try{const m=await user.me();ME.id=m.id;ME.name=m.name;ME.isAdmin=await user.canEdit()||await user.isOwner()}catch(e){}
  }else ME.isAdmin=true;
  if(!DB){ME.isAdmin=true;mode='local'}else mode='db';
  if(mode==='local'){COLS.forEach(c=>S[c]=lsGet(c));ready=true;}
  else{
    let n=0;
    COLS.forEach(c=>{
      DB.collection(c).onSnapshot(snap=>{
        S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
        if(!ready&&++n>=COLS.length)ready=true;
        resolveNames();rerender();try{TRK.scan(c)}catch(e){}
      },e=>{if(!ready&&++n>=COLS.length){ready=true;rerender()}});
    });
    setTimeout(()=>{if(!ready){ready=true;rerender()}},2500);
  }
  loadProf();try{TRK.init()}catch(e){}
  $('#who').innerHTML='<span class="badge">'+(ME.isAdmin?'Dirigeant':'Agent')+'</span>';
  render();
}
async function resolveNames(){
  try{const u=await claude.use('user');if(!u)return;
    const ids=[...new Set([...S.sales.map(s=>s.agent),...S.payments.map(p=>p.agent)].filter(Boolean))];
    if(!ids.length)return;const ps=await u.profiles(ids);let ch=false;
    ids.forEach(i=>{const n=ps[i]&&ps[i].name||'';if(NAMES[i]!==n){NAMES[i]=n;ch=true}});if(ch)rerender();}catch(e){}
}
// Le nom du dirigeant n'apparaît nulle part : ses opérations s'affichent « SenAfterPay ».
const agentOf=d=>d.byAdmin?'SenAfterPay':(d.agent===ME.id?'Moi':(NAMES[d.agent]||'Agent'));
const agentDoc=d=>d.byAdmin?'SenAfterPay':(d.agent===ME.id?(ME.name||'Agent'):(NAMES[d.agent]||'Agent'));
const trLabel=s=>s.type==='credit'?s.schedule.length+(s.schedule.length>1?' tranches':' tranche'):'Comptant';

/* ========= Vues dérivées ========= */
const cancelled=()=>new Set(S.cancels.filter(c=>c.paymentId).map(c=>c.paymentId));
function pays(){const c=cancelled();return S.payments.map(p=>({...p,status:c.has(p.id)?'annulé':'confirmé'}))}
const byId=(arr,id)=>arr.find(x=>x.id===id);
function stockOf(pid){return S.moves.filter(m=>m.productId===pid).reduce((a,m)=>a+m.qty,0)}
const cancelledSales=()=>new Set(S.cancels.filter(c=>c.saleId).map(c=>c.saleId));
const isCancelled=s=>cancelledSales().has(s.id);
function allSales(all){
  const P=pays(),now=today(),cs=cancelledSales();
  return S.sales.filter(s=>all||!cs.has(s.id)).map(s=>({s,st:saleState(s,P,now),c:byId(S.clients,s.clientId),cancelled:cs.has(s.id)})).sort((a,b)=>b.s.date.localeCompare(a.s.date));
}
function dueList(){
  const out=[];
  allSales().forEach(x=>x.st.sched.forEach(e=>{if(e.balance>0)out.push({...e,sale:x.s,client:x.c})}));
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
// Numéro unique créé sur l'appareil (date + code aléatoire) : pas de doublon même si deux agents vendent en même temps.
function nextNumber(prefix){const d=new Date();const r=Math.random().toString(36).slice(2,6).toUpperCase();return prefix+'-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+r}

// Référence de facture au format du carnet : F = n° de facture, P = page (ex. F5P8).
const ref=s=>s.fnum&&s.page?'F'+s.fnum+'P'+s.page:s.number;
// Employé qui a vendu la facture (nom choisi sur la vente).
const sellerOf=s=>s.seller||agentOf(s);
function phoneIntl(p){let n=String(p||'').replace(/\D/g,'');if(n.length===9&&n[0]==='7')n='221'+n;return n.length>=11?n:''}
const phoneShow=p=>{const n=String(p||'').replace(/\D/g,'');return n.length===9?n.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/,'$1 $2 $3 $4'):(p||'')};
function daysUntil(due,now){const f=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};return Math.round((f(due)-f(now))/864e5)}
const productsText=s=>(s.lines||[]).map(l=>l.qty+' x '+l.name).join(', ');
function reminderText(e){
  const c=e.client,d=daysUntil(e.due,today());
  const v={nom:c?c.name:'',montant:money(e.balance),facture:ref(e.sale),tranche:e.n+'/'+e.sale.schedule.length,date:fdate(e.due),produit:productsText(e.sale)};
  let tpl=comp().reminder||(d<0?'Bonjour {nom}, SenAfterPay vous rappelle votre paiement de {montant} pour : {produit} (facture {facture}, tranche {tranche}). Il était prévu le {date}. Merci de bien vouloir régulariser.':'Bonjour {nom}, SenAfterPay vous rappelle votre paiement de {montant} pour : {produit} (facture {facture}, tranche {tranche}). Il est prévu le {date}. Merci de votre confiance.');
  if(!/\{produit\}/.test(tpl))tpl+=' Produit : {produit}.';
  return tpl.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m);
}

/* ========= Factures automatiques : un carnet F = 50 pages (P), un chef par facture =========
   La page est attribuée automatiquement. Chaque couple F+P est réservé (collection « slots »)
   avant d'enregistrer la vente : deux appareils ne peuvent pas obtenir la même page. */
const PAGES=50;
const ow=x=>(x&&x.owner)||'';
const sh=o=>o?String(o).slice(0,8)+'-':'';
const bkey=(o,n)=>sh(o)+'f'+n;
const bookOf=(n,o)=>S.invoices.find(b=>b.num===n&&ow(b)===(o||''));
// Une vente annulée libère sa page, sauf si on a choisi « la laisser vide » (free:false). Les anciennes annulations (sans choix) libèrent aussi leur page.
const freedSales=()=>new Set(S.cancels.filter(c=>c.saleId&&c.free!==false).map(c=>c.saleId));
function usedPages(n,o){o=o||'';const u=new Set(),fr=freedSales();S.sales.forEach(s=>{if(s.fnum===n&&ow(s)===o&&!fr.has(s.id))u.add(s.page)});S.slots.forEach(x=>{if(x.fnum===n&&ow(x)===o&&x.saleId&&!fr.has(x.saleId))u.add(x.page)});return u}
const PROF={};
async function loadProf(){try{const u=await claude.use('user');if(u&&u.list){const L=await u.list();L.forEach(p=>PROF[p.id]={name:p.name,zone:p.zone||'',active:p.active!==false,role:p.role});rerender()}}catch(e){}}
const ownerName=o=>o?((PROF[o]&&PROF[o].name)||NAMES[o]||(o===ME.id?(ME.name||'Moi'):'Agent')):'Anciennes factures';
const ownerZone=o=>(o&&PROF[o]&&PROF[o].zone)||'';
const delDoc=async(c,id)=>{if(DB){await DB.collection(c).doc(id).delete()}else{S[c]=S[c].filter(x=>x.id!==id);lsPut(c);rerender()}};
async function deleteBook(n,owner){
  const d=S.invoices.find(b=>b.num===n&&ow(b)===(owner||''));
  if(S.sales.some(s=>s.fnum===n&&ow(s)===(owner||'')&&!isCancelled(s)))return false;
  if(d)await delDoc('invoices',d.id);return true;
}
function books(o){
  const keys=new Map();
  S.invoices.forEach(b=>keys.set(ow(b)+'|'+b.num,{num:b.num,owner:ow(b)}));
  S.sales.filter(s=>s.fnum&&!isCancelled(s)).forEach(s=>keys.set(ow(s)+'|'+s.fnum,{num:s.fnum,owner:ow(s)}));
  let L=[...keys.values()];
  if(o!==undefined)L=L.filter(b=>b.owner===(o||''));else if(!ME.isAdmin&&ME.id)L=L.filter(b=>b.owner===ME.id);
  return L.sort((a,b)=>a.num-b.num).map(b=>{const u=usedPages(b.num,b.owner).size;return{num:b.num,owner:b.owner,chief:(bookOf(b.num,b.owner)||{}).chief||'',used:u,open:u<PAGES}});
}
const nextFnum=o=>books(o||'').reduce((m,b)=>Math.max(m,b.num),0)+1;
const nextPage=(n,o)=>{const u=usedPages(n,o);for(let p=1;p<=PAGES;p++)if(!u.has(p))return p;return 0};
const chiefOf=s=>(s.fnum&&(bookOf(s.fnum,ow(s))||{}).chief)||'—';
const chiefTelOf=(n,o)=>{const b=bookOf(n,o)||{};const st=S.staff.find(x=>x.name===b.chief);return b.chiefTel||(st&&st.phone)||''};
const okTel=t=>String(t||'').replace(/\D/g,'').length>=9;
const staffNames=()=>S.staff.filter(x=>x.active!==false).map(x=>x.name);
// Vraie panne de réseau ? (sinon, c'est un refus ou une erreur de la base de données)
const isNetFail=e=>navigator.onLine===false||/failed to fetch|networkerror|network request|load failed|timeout|timed out/i.test(String(e&&e.message||e||''));
// Message honnête : « pas de connexion » seulement si c'est vraiment le réseau ; sinon on montre la cause.
const whyFail=e=>isNetFail(e)?'Pas de connexion. Réessaie quand le réseau revient.':'Page de facture indisponible : '+String((e&&e.message)||e||'erreur inconnue').slice(0,140);
let rpcBroken=false;   // la réservation « claim_slot » de Supabase ne répond pas : on utilise la méthode de secours
async function claimSlot(f,p,saleId,o){
  o=o||'';
  if(!DB)return !S.sales.some(s=>s.fnum===f&&s.page===p&&ow(s)===o&&!freedSales().has(s.id));
  const d=DB.doc('slots/'+sh(o)+'F'+f+'P'+p);
  // Réservation encore valable ? Non si elle appartient à une vente annulée dont la page a été libérée.
  const taken=g=>g.exists&&g.data().saleId&&g.data().saleId!==saleId&&!freedSales().has(g.data().saleId);
  let verify=rpcBroken;
  if(!rpcBroken){
    let r;
    try{r=await d.acquire({holder:ME.id||('t'+Math.random().toString(36).slice(2)),ttlMs:5000})}
    catch(e){if(isNetFail(e))throw e;rpcBroken=true;verify=true;r={acquired:true}}
    if(!r.acquired){
      // Verrou refusé : si la page est réellement prise, on passe à la suivante ; sinon on la tente avec vérification.
      if(taken(await d.get()))return false;
      verify=true;
    }
  }
  if(taken(await d.get()))return false;
  await d.set({saleId,fnum:f,page:p,owner:o,by:ME.id||'',at:Date.now()});
  if(verify){const v=await d.get();if(!v.exists||v.data().saleId!==saleId)return false}
  return true;
}
// Donne la prochaine page libre de la facture choisie (de cet agent) ; si elle est pleine, ouvre la suivante (même chef).
async function takePage(pref,chiefIfNew,saleId,telIfNew,o){
  o=o||'';let f=pref,opened=0;
  for(let guard=0;guard<80;guard++){
    if(f==null||!books(o).some(b=>b.num===f&&b.open)){
      if(++opened>3)throw new Error('Aucune page disponible');
      f=nextFnum(o);await put('invoices',bkey(o,f),{num:f,owner:o,chief:chiefIfNew,chiefTel:telIfNew||'',created:today()});
    }
    const u=usedPages(f,o);
    for(let p=1;p<=PAGES;p++){if(u.has(p))continue;if(await claimSlot(f,p,saleId,o))return{f,p,o};u.add(p)}
    f=null;
  }
  throw new Error('Aucune page disponible');
}

/* ========= Tableau de bord : périodes et indicateurs ========= */
let PER={k:'month',from:'',to:''};
function rangeOf(k){
  const t=today(),d=new Date();
  if(k==='day')return{from:t,to:t};
  if(k==='week'){const dow=(d.getDay()+6)%7;return{from:addDays(t,-dow),to:t}}
  if(k==='month')return{from:t.slice(0,8)+'01',to:t};
  return{from:PER.from||t.slice(0,8)+'01',to:PER.to||t};

const costOf=pid=>{const c=S.costs.find(x=>x.id===pid);return c?c.cost:0};

function dash(from,to){

  const A=allSales().filter(x=>mine(x.s));
  const sIn=A.filter(x=>inR(x.s.date));
  const P=pays().filter(p=>p.status!=='annulé'&&mine(p)&&inR(p.date.slice(0,10)));
  const ca=sIn.reduce((a,x)=>a+x.s.total,0),enc=P.reduce((a,p)=>a+p.amount,0);
  let marge=0;const prod={};
  sIn.forEach(x=>x.s.lines.forEach(l=>{marge+=(l.price-costOf(l.productId))*l.qty;const k=l.name;(prod[k]=prod[k]||{q:0,t:0});prod[k].q+=l.qty;prod[k].t+=l.price*l.qty}));
  const dep=ME.isAdmin?expActive().filter(e=>inR(e.date)).reduce((a,e)=>a+e.amount,0):0;
  const emp={};sIn.forEach(x=>{const k=sellerOf(x.s);(emp[k]=emp[k]||{n:0,t:0,p:0});emp[k].n++;emp[k].t+=x.s.total;emp[k].p+=x.st.paid});
  const byDay={};P.forEach(p=>{const d=p.date.slice(0,10);byDay[d]=(byDay[d]||0)+p.amount});
  const owed=A.reduce((a,x)=>a+x.st.balance,0),late=A.reduce((a,x)=>a+x.st.late,0);
  const stockVal=S.products.reduce((a,p)=>a+Math.max(0,stockOf(p.id))*costOf(p.id),0);
  return{ca,enc,marge,dep,emp,prod,byDay,owed,late,stockVal,nSales:sIn.length,result:marge-dep};
}

function chartHTML(byDay,from,to){
  const pts=[];const f=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const days=Math.round((f(to)-f(from))/864e5)+1;
  if(days<=62){for(let i=0;i<days;i++){const d=addDays(from,i);pts.push({k:d,v:byDay[d]||0,l:d.slice(8)+'/'+d.slice(5,7)})}}
  else{const m={};Object.keys(byDay).forEach(d=>{const k=d.slice(0,7);m[k]=(m[k]||0)+byDay[d]});let y=+from.slice(0,4),mo=+from.slice(5,7);while(y*12+mo<=+to.slice(0,4)*12+ +to.slice(5,7)){const k=y+'-'+pad(mo);pts.push({k,v:m[k]||0,l:pad(mo)+'/'+String(y).slice(2)});mo++;if(mo>12){mo=1;y++}}}
  const max=Math.max(...pts.map(p=>p.v));
  if(!max)return '<div class="empty">Aucun encaissement sur cette période.</div>';
  const mag=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/mag*2)/2*mag;
  const W=360,H=160,L=40,B=22,T=10,iw=W-L-4,ih=H-B-T,n=pts.length,bw=Math.max(2,Math.min(26,iw/n*.66));
  const y=v=>T+ih-v/top*ih;
  let g='';[0,.5,1].forEach(t=>{const yy=y(top*t);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+4}" text-anchor="end">${nk(top*t)}</text>`});
  pts.forEach((p,i)=>{const x=L+iw/n*(i+.5)-bw/2;const h=p.v/top*ih;if(p.v)g+=`<rect class="bar-r" x="${x.toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(p.l)} : ${money(p.v)}</title></rect>`});
  const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  lab.forEach(i=>{g+=`<text x="${(L+iw/n*(i+.5)).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${pts[i].l}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Encaissements par ${days<=62?'jour':'mois'}">${g}</svg>`;
}

  try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),gn=A.createGain();o.frequency.value=880;gn.gain.value=.2;o.connect(gn);gn.connect(A.destination);o.start();setTimeout(()=>{o.stop();A.close()},500)}catch(e){}
  if(SAPN){SAPN.notify({title:'SenAfterPay · Rappel',body:msg}).catch(()=>{});return}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('SenAfterPay',{body:msg})}catch(e){}
}
function cbTick(){
  if(!ready||!ME.id)return;
  let seen;try{seen=new Set(JSON.parse(localStorage.getItem('sap_cb_n')||'[]'))}catch(e){seen=new Set()}
  let ch=false;
  S.reminders.filter(x=>x.kind==='cb'&&!x.done&&x.by===ME.id&&new Date(x.at).getTime()<=Date.now()).forEach(x=>{
    const k=x.id+'@'+x.at;if(seen.has(k))return;seen.add(k);ch=true;
    const c=byId(S.clients,x.clientId),m='📞 Rappeler '+(c?c.name:'le client')+(x.note?' : '+x.note:'');cbAlert(m);cbRing(x,m);
  });
  if(ch){try{localStorage.setItem('sap_cb_n',JSON.stringify([...seen].slice(-200)))}catch(e){}rerender()}
}

function openDuePay(sid,n){
  const s=byId(S.sales,sid);if(!s)return;

  sheet('Paiement reçu',`<div class="card"><b>${esc(c?c.name:'Client')}</b><div class="note" style="margin:2px 0 8px">${esc(ref(s))} · tranche ${e.n}/${s.schedule.length} · prévue le ${fdate(e.due)}</div>

let dueF='all';
function dayLabel(d,now){
  const[y,m,dd]=d.split('-').map(Number);
  let t=new Date(y,m-1,dd).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  t=t.charAt(0).toUpperCase()+t.slice(1);
  const diff=Math.round((new Date(y,m-1,dd)-new Date(...now.split('-').map((n,i)=>i===1?n-1:+n)))/864e5);
  const tag=diff<0?['bad','En retard de '+(-diff)+' j']:diff===0?['warn',"Aujourd'hui"]:diff===1?['warn','Demain · rappel à envoyer']:diff<=5?['warn','Dans '+diff+' jours · rappel à envoyer']:null;
  return{t,tag};
}
