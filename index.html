async function openAccess(){
  let u=null;try{u=await claude.use('user')}catch(e){}
  const o=sheet('Accès des agents','',()=>{});
  if(!u||!u.list){setBody(o,'<p class="note" style="margin-top:0">Cet écran est disponible dans l\'application installée sur votre propre adresse.</p>');return}
  async function draw(){
    let L=[];try{L=await u.list()}catch(e){}
    setBody(o,`<p class="note" style="margin-top:0">Un compte désactivé perd tout accès immédiatement. Ses ventes et ses paiements restent à son nom. Pour ajouter un agent : Supabase > Authentication > Users > Add user.</p>
    ${L.map(x=>`<div class="vrow"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(x.name||'Sans nom')}</b><span class="pill ${x.active===false?'bad':'ok'}">${x.active===false?'Désactivé':(x.role==='admin'?'Directeur':'Actif')}</span></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="n_${x.id}" value="${esc(x.name)}" aria-label="Nom" style="flex:1;min-width:0"></div>
      <div style="display:flex;gap:8px;margin-top:8px"><input id="z_${x.id}" value="${esc(x.zone||'')}" placeholder="Zone ou ville (ex. Pikine)" aria-label="Zone" style="flex:1;min-width:0"><button type="button" class="btn sm sec2" data-sv="${x.id}">Enregistrer</button></div>
      ${x.role==='admin'?'':`<button type="button" class="btn sm ${x.active===false?'':'danger'}" style="margin-top:8px" data-tg="${x.id}">${x.active===false?'Réactiver le compte':'Désactiver le compte'}</button>`}</div>`).join('')||'<div class="empty">Aucun compte.</div>'}
    <p class="note" id="aerr" style="color:var(--bad)"></p>`);
    const run=async(fn)=>{try{await fn();draw()}catch(e){$('#aerr',o.el).textContent='Refusé : '+(e&&e.message||'erreur')}};
    o.el.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>run(()=>u.update(b.dataset.sv,{name:(document.getElementById('n_'+b.dataset.sv)||{}).value||'',zone:(document.getElementById('z_'+b.dataset.sv)||{}).value||''}).then(loadProf)));
    o.el.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>run(()=>{const x=L.find(q=>q.id===b.dataset.tg);return u.update(x.id,{active:x.active===false}).then(loadProf)}));
  }
  draw();
}
async function openAudit(){
  let u=null;try{u=await claude.use('user')}catch(e){}
  const o=sheet('Traces de sécurité','',()=>{});
  if(!u||!u.audit){setBody(o,'<p class="note" style="margin-top:0">Disponible dans l\'application installée sur votre propre adresse.</p>');return}
  let L=[],P=[];try{L=await u.audit();P=await u.list()}catch(e){}
  const nm=id=>{const p=P.find(x=>x.id===id);return p?p.name:(id?'Utilisateur':'Base de données')};
  const lab={sales:'Vente',payments:'Paiement',invoices:'Facture',products:'Produit',costs:'Prix d\'achat',cancels:'Annulation',moves:'Stock',staff:'Employé',settings:'Réglage',expenses:'Dépense',remittances:'Remise',counts:'Comptage',clients:'Client',profiles:'Compte'};
  const sm=x=>{const d=x.old||{};return d.amount!=null?money(d.amount):d.total!=null?money(d.total):(d.name||'')};
  setBody(o,`<p class="note" style="margin-top:0">Chaque modification ou suppression est notée ici par la base et ne peut pas être effacée depuis l'application. Les 100 dernières.</p><div class="list">${L.map(x=>`<div class="row" style="cursor:default"><div class="l"><b>${x.op==='DELETE'?'Supprimé':'Modifié'} · ${esc(lab[x.col]||x.col||'')}</b><small>${new Date(x.at).toLocaleString('fr-FR')} · par ${esc(nm(x.uid))}</small></div><div class="r"><small>${esc(sm(x))}</small></div></div>`).join('')||'<div class="empty">Aucune trace pour le moment.</div>'}</div>`);
}

function receiptHTML(p,s,c,st,cn){
  const kind={acompte:'Acompte',comptant:'Paiement comptant',versement:'Versement'}[p.kind]||'Paiement';
  return `<div class="receipt">${headHTML()}<hr style="border:0;border-top:1px solid #ddd;margin:10px 0">
  <b>REÇU N° ${esc(p.number)}</b>${p.status==='annulé'?' <b style="color:#b4281f">— ANNULÉ</b>':''}<br><small>${fdate(p.date)} · Encaissé par ${esc(!p.collector||p.collector===DIRECT?(comp().name||'SenAfterPay'):p.collector)}</small>
  <table class="tbl" style="margin-top:10px"><tbody>
  <tr><td>Client</td><td class="n">${esc(c?c.name:'')}</td></tr>
  <tr><td>Facture</td><td class="n">${esc(s?ref(s):'')}</td></tr>
  <tr><td>${kind}</td><td class="n"><b>${money(p.amount)}</b></td></tr>
  <tr><td>Moyen</td><td class="n">${esc(p.method)}${p.ref?' · '+esc(p.ref):''}</td></tr>
  ${st?`<tr><td>Reste à payer</td><td class="n"><b>${money(st.balance)}</b></td></tr>`:''}
  </tbody></table>${cn?`<p><small>Annulé le ${fdate(cn.date)} : ${esc(cn.reason)}</small></p>`:''}
  ${p.method!=='Espèces'&&p.status!=='annulé'?'<p><small>Paiement mobile ou bancaire déclaré, à vérifier auprès de l\'opérateur.</small></p>':''}</div>`;
}
const FXCSS='<style>.fx{background:#fff;color:#0b1f66;font:14px/1.4 system-ui,-apple-system,sans-serif;border:1px solid #dfe2ee;border-radius:12px;padding:16px;overflow:hidden}.fx *{box-sizing:border-box}.fx-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}.fx-logo{height:60px;width:auto;max-width:100%}.fx-ids{margin:12px 0 0;font-size:13px}.fx-ids div{display:flex;gap:8px;align-items:center;margin:4px 0}.fx-ids svg,.fx-foot svg{width:16px;height:16px;flex:none;stroke:#0b1f66;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.fx-title{font:800 22px system-ui,sans-serif;border-bottom:3px solid #f2b705;padding-bottom:2px;text-align:right;white-space:nowrap}.fx-title small{display:block;font:600 12px system-ui;color:#5a6486;border:0;margin-top:2px}.fx-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 14px}.fx-box{border:1px solid #0b1f66;border-radius:10px;padding:22px 12px 6px;position:relative;margin-top:16px}.fx-tab{position:absolute;top:-1px;left:-1px;background:#0b1f66;color:#fff;border-radius:10px 0 10px 0;padding:3px 12px;font-weight:700;font-size:12.5px}.fx-row{display:flex;gap:6px;align-items:baseline;border-bottom:1px solid #8a93b8;padding:5px 0;font-size:13px;min-height:28px}.fx-row:last-child{border-bottom:0}.fx-row b{font-weight:400;flex:none}.fx-row span{flex:1;font-weight:700;overflow-wrap:anywhere}.fx table{width:100%;border-collapse:collapse;margin-top:18px}.fx th{background:#0b1f66;color:#fff;padding:7px 6px;font-size:13px;border:1px solid #0b1f66}.fx td{border:1px solid #0b1f66;padding:5px 6px;height:30px;font-size:13px}.fx .n{text-align:right;white-space:nowrap}.fx .c{text-align:center}.fx-wrap{overflow-x:auto}.fx-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:18px;border-top:1px solid #dfe2ee;padding-top:10px;font-size:12px}.fx-foot span{display:flex;gap:6px;align-items:center}.fx-note{font-size:11px;color:#5a6486;margin:8px 0 0;text-align:center}</style>';

function splitName(full){const p=String(full||'').trim().split(/\s+/).filter(Boolean);return p.length<2?{prenom:'',nom:p[0]||''}:{prenom:p.slice(0,-1).join(' '),nom:p[p.length-1]}}
function chiefInfo(s){const nm=s.fnum&&(bookOf(s.fnum,ow(s))||{}).chief||'';const st=S.staff.find(x=>x.name===nm);const n=splitName(nm);return{nom:n.nom,prenom:n.prenom,tel:chiefTelOf(s.fnum,ow(s))?phoneShow(chiefTelOf(s.fnum,ow(s))):''}}
function invoiceHTML(s,c,st){
  const co=comp(),f=n=>money(n).replace(' FCFA',''),ch=chiefInfo(s),cl=c||{};
  const row=(l,v)=>`<div class="fx-row"><b>${l} :</b><span>${esc(v||'')}</span></div>`;
  const filler=Math.max(0,8-s.lines.length);
  const lab={payee:'Payée',retard:'En retard',aujourdhui:"Aujourd'hui",avenir:'À venir'};
  const ids=[[FXI.pin,'Adresse',co.address],[FXI.bld,'NINEA',co.ninea],[FXI.bld,'RCCM',co.rccm]].filter(x=>x[2]);
  const phones=[co.phone,co.whatsapp].filter(Boolean).join(' / ');
  const foot=[[FXI.tel,phones],[FXI.mail,co.email],[FXI.web,co.website]].filter(x=>x[1]);
  const livr=[cl.address,[cl.city,cl.landmark].filter(Boolean).join(' · ')].filter(Boolean);

function docHTML(title,body){

function receiptText(p,s,c,st){return 'Reçu '+p.number+' SenAfterPay\nClient : '+(c?c.name:'')+'\nMontant : '+money(p.amount)+' ('+p.method+')\nReste à payer : '+money(st?st.balance:0)+'\nMerci !'}
function waLink(c,text){
  let n=((c&&c.phone)||'').replace(/\D/g,'');if(n.length===9&&n[0]==='7')n='221'+n;
  return 'https://wa.me/'+(n.length>=11?n:'')+'?text='+encodeURIComponent(text);
}
async function saveFile(name,html){
  try{const d=await claude.use('downloads');if(!d){toast('Enregistrement indisponible ici');return}
    await d.save({filename:name,data:html});toast('Document enregistré');
  }catch(e){if(!e||e.code!=='declined')toast('Enregistrement impossible')}
}
