<style>
/* Mise en page : une colonne mobile, barre d'onglets en bas, feuilles modales plein écran pour les saisies. */
:root{
  --bg:#f2f3f9; --card:#ffffff; --ink:#111a3a; --mute:#5a6486; --line:#dfe2ee;
  --accent:#14307f; --accent-ink:#ffffff; --accent-soft:#e4e9f8;
  --gold:#f2a900; --gold-soft:#fdf0cc; --violet:#6a1bd6;
  --ok:#1b7f4b; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbefd2; --bad:#b4281f; --bad-soft:#fbe0dd;
  --shadow:0 1px 2px rgba(17,26,58,.06),0 4px 14px rgba(17,26,58,.06);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f20; --card:#141a33; --ink:#e9ecf8; --mute:#9aa3c4; --line:#262f50;
  --accent:#9bb0ff; --accent-ink:#0b1230; --accent-soft:#1c2650; --gold:#f5b82e; --gold-soft:#3a2d0c; --violet:#b48cff;
  --ok:#5fd193; --ok-soft:#163626; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8b80; --bad-soft:#3d1c19; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f20; --card:#141a33; --ink:#e9ecf8; --mute:#9aa3c4; --line:#262f50;
  --accent:#9bb0ff; --accent-ink:#0b1230; --accent-soft:#1c2650; --gold:#f5b82e; --gold-soft:#3a2d0c; --violet:#b48cff;
  --ok:#5fd193; --ok-soft:#163626; --warn:#f0b955; --warn-soft:#3a2d12; --bad:#ff8b80; --bad-soft:#3d1c19; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-block:0 92px;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:#fff;border-bottom:3px solid var(--gold);box-shadow:var(--shadow)}
.hd-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0} .brand img{height:40px;width:auto;flex:none}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;color:#0f2a6b} .brand b i{font-style:normal;color:#e69a00} .brand b u{text-decoration:none;color:#6a1bd6}
.brand small{display:block;font:500 10.5px var(--f-body);color:#5a6486;letter-spacing:.03em;margin-top:3px;white-space:nowrap}
.who{font-size:12px;color:#5a6486;text-align:right;flex:none;line-height:1.5}
.who .badge{background:#e4e9f8;color:#14307f}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:600 10.5px var(--f-body);padding:8px 1px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)} .tabs button[aria-selected="true"] svg{stroke:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec{margin-block:18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:17px;color:var(--ink)} .sec span{font-size:12px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 19px var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute)} .kpi.alert b{color:var(--bad)} .kpi.big{grid-column:1/-1;background:linear-gradient(120deg,#14307f 0%,#4b1fb8 100%);color:#fff;border:0}
.kpi.big span{color:#fff;opacity:.85} .kpi.big b{font-size:28px;color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;min-width:0}
.row .l{min-width:0} .row .l b{display:block;overflow-wrap:anywhere} .row .l small{color:var(--mute);display:block}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .r b{display:block}
.dc{display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a,.acts button{flex:1;min-width:76px;border:0;cursor:pointer;text-align:center;text-decoration:none;padding:10px 8px;border-radius:10px;font:700 13px var(--f-body);background:var(--accent-soft);color:var(--accent)}
.acts a.wa,.acts button.wa{background:var(--ok-soft);color:var(--ok)}
.chart{width:100%;height:auto;display:block} .chart text{fill:var(--mute);font:11px var(--f-body)} .chart .bar-r{fill:var(--accent)} .chart line{stroke:var(--line)}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.menu .row{padding:14px}
.menu .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-right:12px}
.menu .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi small{display:block;font-size:11px;color:var(--mute);margin-top:2px} .kpi.big small{color:#fff;opacity:.8}
.kpi.good b{color:var(--ok)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold)}
.empty{padding:22px 14px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--mute)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-body);padding:13px 16px;border-radius:12px;cursor:pointer;width:100%}
.btn.sec2{background:var(--accent-soft);color:var(--accent)} .btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.fab{background:var(--gold);color:#2b1d00;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5;border-radius:99px;padding:13px 20px}
input,select{font:16px var(--f-body);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid2>*{min-width:0}
.search{margin-block:4px 10px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-bottom:30px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet header h2{font-size:20px} .x{border:0;background:var(--card);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .tbl th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tbl td.n,.tbl th.n{text-align:right}
.scroll{overflow-x:auto}
.line-item{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:600 14px var(--f-body);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums} .tot.g{font:700 18px var(--f-display);border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:90vw}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.receipt{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:16px}
.receipt .cbox{background:#f4f6fb;border-radius:8px;padding:8px 10px;margin:10px 0}.receipt .big{font-size:17px;color:#14307f}.receipt .sigs{display:flex;gap:12px;margin-top:24px}.receipt .sigs div{flex:1;border-top:1px solid #999;padding-top:4px;text-align:center;font-size:11px;color:#555}.receipt .foot{margin:12px 0 0;text-align:center;font-size:11px;color:#555}.receipt .tot{color:#111}
.receipt .lg{display:block;height:auto;max-height:64px;max-width:100%;width:auto;margin:0 auto 6px} .receipt .tag{display:block;text-align:center;color:#5a6486;font-size:11px;letter-spacing:.06em;text-transform:uppercase} .receipt small{color:#555}
.receipt .tbl td,.receipt .tbl th{border-color:#ddd;color:#111} .receipt .tbl th{color:#555}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:0}}}
</style>
<style>
#sapLogin{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#sapLogin .lg-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;width:100%;max-width:360px;text-align:center}
#sapLogin h1{font:800 26px/1.1 'Bricolage Grotesque',system-ui;margin:8px 0 2px;color:var(--accent)} #sapLogin h1 i{font-style:normal;color:var(--gold)} #sapLogin h1 u{text-decoration:none;color:var(--violet)}
#sapLogin p{color:var(--mute);margin:0 0 14px;font-size:13px} #sapLogin label{display:block;text-align:left;margin-top:10px}
#sapLogin .lg-m{color:var(--bad);min-height:18px;margin:8px 0}
#sapOut{margin-left:8px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;cursor:pointer}

/* SenAfterPay autonome : remplace la plateforme Claude par Supabase (connexion, base de données, téléchargements). */
window.SAP_STANDALONE=true;
window.SAP_LIBS={h2c:'html2canvas.min.js',pdf:'jspdf.umd.min.js'};
(function(){
  const CFG=window.SAP_CONFIG||{};
  const configured=CFG.url&&CFG.key&&!/VOTRE/i.test(CFG.url+CFG.key);
  let sb=null,session=null,profile=null;
  const $=s=>document.querySelector(s);
  const LSQ='sap_queue',LSC='sap_cache_';
  const cache={},subs={};   // cache[col]=Map(id->data)
  let queue=[];try{queue=JSON.parse(localStorage.getItem(LSQ)||'[]')}catch(e){}
  const saveQ=()=>{try{localStorage.setItem(LSQ,JSON.stringify(queue))}catch(e){}};
  const saveC=c=>{try{localStorage.setItem(LSC+c,JSON.stringify([...cache[c]]))}catch(e){}};
  const loadC=c=>{try{return new Map(JSON.parse(localStorage.getItem(LSC+c)||'[]'))}catch(e){return new Map()}};
  function emit(c){(subs[c]||[]).forEach(cb=>cb({docs:[...cache[c]].map(([id,d])=>({id,data:()=>d}))}))}
  function banner(t){let b=$('#sapNet');if(!t){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='sapNet';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#f2a900;color:#14307f;font:600 12px system-ui;text-align:center;padding:4px';document.body.appendChild(b)}b.textContent=t}
  const isNetErr=e=>!e||/fetch|network|failed|load/i.test(String(e.message||e))||e.code==='';

  function loginUI(msg){
    return new Promise(res=>{
      let o=$('#sapLogin');if(o)o.remove();
      o=document.createElement('div');o.id='sapLogin';
      o.innerHTML='<form class="lg-card" autocomplete="on"><img src="'+(window.SAP_EMBLEM||'')+'" alt="" width="72" height="72"><h1>Sen<i>After</i><u>Pay</u></h1><p>Achetez aujourd\'hui, payez après.</p>'+
        (configured?'<label for="lgE">E-mail</label><input id="lgE" type="email" autocomplete="username" required><label for="lgP">Mot de passe</label><input id="lgP" type="password" autocomplete="current-password" required><p id="lgM" class="lg-m"></p><button class="btn" type="submit">Se connecter</button>':
        '<p class="lg-m">L\'application n\'est pas encore reliée à sa base de données. Ouvrez le fichier <b>config.js</b> et renseignez l\'adresse et la clé de votre projet Supabase.</p>')+'</form>';
      document.body.appendChild(o);
      if(msg)$('#lgM')&&($('#lgM').textContent=msg);
      const f=o.querySelector('form');
      f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;$('#lgM').textContent='';
        const{data,error}=await sb.auth.signInWithPassword({email:$('#lgE').value.trim(),password:$('#lgP').value});
        b.disabled=false;
        if(error){$('#lgM').textContent=/invalid/i.test(error.message)?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+error.message;return}
        session=data.session;o.remove();res()};
    });
  }
  async function ensureSession(){
    if(!configured){await loginUI();return new Promise(()=>{})}
    sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
    try{const{data}=await sb.auth.getSession();session=data.session}catch(e){}
    if(!session){
      // hors connexion avec un accès déjà utilisé : on laisse ouvrir en lecture
      await loginUI();
    }
    try{const{data}=await sb.from('profiles').select('id,name,role,active').eq('id',session.user.id).maybeSingle();profile=data||{id:session.user.id,name:'',role:'agent'}}
    catch(e){profile={id:session.user.id,name:'',role:'agent'}}
    try{const p=JSON.parse(localStorage.getItem('sap_profile')||'null');if(p&&p.id===session.user.id&&!profile.role)profile=p}catch(e){}
    try{localStorage.setItem('sap_profile',JSON.stringify(profile))}catch(e){}
  }
  let sessionP=null;const sess=()=>sessionP||(sessionP=ensureSession().then(()=>{if(profile&&profile.active===false)blockUI();else checkActive()}));

  async function flush(){
    if(!sb||!queue.length)return;
    const rest=[];
    for(const q of queue){
      try{const{error}=await sb.from('docs').upsert({col:q.c,id:q.id,data:q.data,updated_at:new Date().toISOString()});if(error)throw error}
      catch(e){if(isNetErr(e)){rest.push(q);rest.push(...queue.slice(queue.indexOf(q)+1));break}else{console.warn('rejeté',q.c,q.id,e.message);checkActive()}}
    }
    queue=rest;saveQ();banner(queue.length?queue.length+' opération(s) en attente de connexion':'');
  }
  let blocked=false;
  function blockUI(){
    if(blocked)return;blocked=true;
    const o=document.createElement('div');o.id='sapBlock';o.style.cssText='position:fixed;inset:0;z-index:200;background:#14307f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font:16px system-ui';
    o.innerHTML='<h1 style="margin:0 0 12px;font-size:22px">Compte désactivé</h1><p style="max-width:320px;margin:0 0 20px">Votre accès a été arrêté par le directeur. Aucune opération n\'est possible.</p><button style="padding:12px 20px;border:0;border-radius:10px;font-weight:700">Se déconnecter</button>';
    o.querySelector('button').onclick=()=>window.SAP_LOGOUT();document.body.appendChild(o);
  }
  async function checkActive(){
    if(!sb||!session||blocked)return;
    try{const{data,error}=await sb.from('profiles').select('active').eq('id',session.user.id).maybeSingle();if(!error&&data&&data.active===false){profile.active=false;queue=[];saveQ();blockUI()}}catch(e){}
  }
  addEventListener('online',()=>{checkActive();flush()});setInterval(()=>{checkActive();flush()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkActive()});

  async function loadCol(c){
    try{
      let all=[],from=0;
      for(;;){const{data,error}=await sb.from('docs').select('id,data').eq('col',c).range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
      cache[c]=new Map(all.map(r=>[r.id,r.data]));saveC(c);
      // réappliquer ce qui est encore en attente d'envoi
      queue.filter(q=>q.c===c).forEach(q=>cache[c].set(q.id,q.data));
      return true;
    }catch(e){cache[c]=cache[c]||loadC(c);return false}
  }
  let chan=null;
  function listen(){
    if(chan)return;
    chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.col&&p.eventType==='DELETE')return;
      const c=(p.new&&p.new.col)||(p.old&&p.old.col);if(!c||!cache[c])return;
      if(p.eventType==='DELETE'){cache[c].delete(p.old.id)}else cache[c].set(p.new.id,p.new.data);
      saveC(c);emit(c);
    }).subscribe();
  }
  const slash=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  function docRef(c,id){
    return{
      async set(obj){
        cache[c]=cache[c]||new Map();cache[c].set(id,obj);saveC(c);emit(c);
        try{const{error}=await sb.from('docs').upsert({col:c,id,data:obj,updated_at:new Date().toISOString()});if(error)throw error}
        catch(e){if(isNetErr(e)){queue=queue.filter(q=>!(q.c===c&&q.id===id));queue.push({c,id,data:obj});saveQ();banner(queue.length+' opération(s) en attente de connexion')}
          else{cache[c].delete(id);saveC(c);emit(c);throw e}}
      },
      async delete(){
        if(cache[c]){cache[c].delete(id);saveC(c);emit(c)}
        const{error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;
      },
      async get(){const{data}=await sb.from('docs').select('data').eq('col',c).eq('id',id).maybeSingle();return{exists:!!data,data:()=>data?data.data:undefined}},
      async acquire({holder}){const{data,error}=await sb.rpc('claim_slot',{p_id:id,p_holder:String(holder)});if(error)throw error;return{acquired:data===true}}
    };
  }
  const DB={
    collection(c){return{
      doc:id=>docRef(c,id),
      onSnapshot(cb,errcb){
        (subs[c]=subs[c]||[]).push(cb);
        (async()=>{await sess();const ok=await loadCol(c);listen();emit(c);if(!ok&&errcb&&!cache[c].size){}})();
        return()=>{subs[c]=subs[c].filter(x=>x!==cb)};
      }}},
    doc(path){const[c,id]=slash(path);return docRef(c,id)}
  };
  const USER={
    async me(){return{id:session.user.id,name:profile.name||session.user.email.split('@')[0]}},
    async canEdit(){return profile.role==='admin'},
    async isOwner(){return profile.role==='admin'},
    async list(){const{data,error}=await sb.from('profiles').select('id,name,role,active,zone').order('name');if(error)throw error;return data||[]},
    async update(id,patch){const{error}=await sb.from('profiles').update(patch).eq('id',id);if(error)throw error},
    async audit(){const{data,error}=await sb.from('audit').select('*').order('at',{ascending:false}).limit(100);if(error)throw error;return data||[]},
    async profiles(ids){
      try{const{data}=await sb.from('profiles').select('id,name').in('id',ids);const o={};(data||[]).forEach(p=>o[p.id]={name:p.name});return o}catch(e){return{}}
    }
  };
  const DL={async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.pdf$/i.test(filename)?'application/pdf':/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{status:'saved'}
  }};
  window.claude={async use(n){
    if(n==='db'){await sess();return DB}
    if(n==='user'){await sess();return USER}
    if(n==='downloads')return DL;

   Le solde n'est jamais stocké : il se recalcule à partir des paiements non annulés. */
function addDays(s,k){const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+k))}
// Échéancier libre : n tranches, 1re date choisie par le dirigeant, puis un pas (mois ou jours) à partir de la 1re.
// step = {m:1} (chaque mois) ou {d:15} (tous les 15 jours). Le reliquat d'arrondi va à la dernière tranche.
function buildSchedule(total,deposit,n,first,step){
  const rest=Math.max(0,Math.round(total)-Math.round(deposit));
  if(!n||rest===0)return[];
  const base=Math.floor(rest/n);const out=[];
  for(let i=0;i<n;i++){
    const due=step&&step.d?addDays(first,i*step.d):addMonths(first,i*((step&&step.m)||1));
    out.push({n:i+1,due,amount:i===n-1?rest-base*(n-1):base});
  }
  return out;
}
// Les versements (hors acompte) remboursent les échéances dans l'ordre, la plus ancienne d'abord.
function allocate(schedule,paidTotal,now){
  let left=paidTotal;

    const paid=Math.min(e.amount,left);left-=paid;
    const bal=e.amount-paid;
    let st='avenir';
    if(bal===0)st='payee';else if(e.due<now)st='retard';else if(e.due===now)st='aujourdhui';

  const inst=ok.filter(p=>p.kind==='versement').reduce((a,p)=>a+p.amount,0);
  const paid=deposit+inst;
  const sched=allocate(sale.schedule||[],inst,now);
  const balance=Math.max(0,sale.total-paid);
  const late=sched.filter(e=>e.status==='retard').reduce((a,e)=>a+e.balance,0);

const PAGES=50;

const freedSales=()=>new Set(S.cancels.filter(c=>c.saleId&&c.free!==false).map(c=>c.saleId));
function usedPages(n,o){o=o||'';const u=new Set(),fr=freedSales();S.sales.forEach(s=>{if(s.fnum===n&&ow(s)===o&&!fr.has(s.id))u.add(s.page)});S.slots.forEach(x=>{if(x.fnum===n&&ow(x)===o&&x.saleId&&!fr.has(x.saleId))u.add(x.page)});return u}

let rpcBroken=false;   // la réservation « claim_slot » de Supabase ne répond pas : on utilise la méthode de secours
async function claimSlot(f,p,saleId,o){
  o=o||'';

  const d=DB.doc('slots/'+sh(o)+'F'+f+'P'+p);
  // Réservation encore valable ? Non si elle appartient à une vente annulée dont la page a été libérée.
  const taken=g=>g.exists&&g.data().saleId&&g.data().saleId!==saleId&&!freedSales().has(g.data().saleId);
  let verify=rpcBroken;
  if(!rpcBroken){
    let r;
    try{r=await d.acquire({holder:ME.id||('t'+Math.random().toString(36).slice(2)),ttlMs:5000})}
    catch(e){if(isNetFail(e))throw e;rpcBroken=true;verify=true;r={acquired:true}}
    if(!r.acquired){
      // Verrou refusé : si la page est réellement prise, on passe à la suivante ; sinon on la tente avec vérification.
      if(taken(await d.get()))return false;
      verify=true;
    }
  }
  if(taken(await d.get()))return false;
  await d.set({saleId,fnum:f,page:p,owner:o,by:ME.id||'',at:Date.now()});

// Donne la prochaine page libre de la facture choisie (de cet agent) ; si elle est pleine, ouvre la suivante (même chef).
async function takePage(pref,chiefIfNew,saleId,telIfNew,o){
  o=o||'';let f=pref,opened=0;
  for(let guard=0;guard<80;guard++){
    if(f==null||!books(o).some(b=>b.num===f&&b.open)){
      if(++opened>3)throw new Error('Aucune page disponible');

    for(let p=1;p<=PAGES;p++){if(u.has(p))continue;if(await claimSlot(f,p,saleId,o))return{f,p,o};u.add(p)}

  }

}

/* ========= Tableau de bord : périodes et indicateurs ========= */
let PER={k:'month',from:'',to:''};

  if(k==='week'){const dow=(d.getDay()+6)%7;return{from:addDays(t,-dow),to:t}}
  if(k==='month')return{from:t.slice(0,8)+'01',to:t};
  return{from:PER.from||t.slice(0,8)+'01',to:PER.to||t};
}
const costOf=pid=>{const c=S.costs.find(x=>x.id===pid);return c?c.cost:0};

  let marge=0;const prod={};
  sIn.forEach(x=>x.s.lines.forEach(l=>{marge+=(l.price-costOf(l.productId))*l.qty;const k=l.name;(prod[k]=prod[k]||{q:0,t:0});prod[k].q+=l.qty;prod[k].t+=l.price*l.qty}));
  const dep=ME.isAdmin?expActive().filter(e=>inR(e.date)).reduce((a,e)=>a+e.amount,0):0;

  const byDay={};P.forEach(p=>{const d=p.date.slice(0,10);byDay[d]=(byDay[d]||0)+p.amount});

const nk=n=>n>=1e6?(n/1e6).toFixed(n%1e6?1:0).replace('.',',')+' M':n>=1000?Math.round(n/1000)+' k':String(Math.round(n));
function chartHTML(byDay,from,to){
  const pts=[];const f=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const days=Math.round((f(to)-f(from))/864e5)+1;
  if(days<=62){for(let i=0;i<days;i++){const d=addDays(from,i);pts.push({k:d,v:byDay[d]||0,l:d.slice(8)+'/'+d.slice(5,7)})}}
  else{const m={};Object.keys(byDay).forEach(d=>{const k=d.slice(0,7);m[k]=(m[k]||0)+byDay[d]});let y=+from.slice(0,4),mo=+from.slice(5,7);while(y*12+mo<=+to.slice(0,4)*12+ +to.slice(5,7)){const k=y+'-'+pad(mo);pts.push({k,v:m[k]||0,l:pad(mo)+'/'+String(y).slice(2)});mo++;if(mo>12){mo=1;y++}}}
  const max=Math.max(...pts.map(p=>p.v));
  if(!max)return '<div class="empty">Aucun encaissement sur cette période.</div>';
  const mag=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/mag*2)/2*mag;
  const W=360,H=160,L=40,B=22,T=10,iw=W-L-4,ih=H-B-T,n=pts.length,bw=Math.max(2,Math.min(26,iw/n*.66));
  const y=v=>T+ih-v/top*ih;
  let g='';[0,.5,1].forEach(t=>{const yy=y(top*t);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+4}" text-anchor="end">${nk(top*t)}</text>`});
  pts.forEach((p,i)=>{const x=L+iw/n*(i+.5)-bw/2;const h=p.v/top*ih;if(p.v)g+=`<rect class="bar-r" x="${x.toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${esc(p.l)} : ${money(p.v)}</title></rect>`});
  const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  lab.forEach(i=>{g+=`<text x="${(L+iw/n*(i+.5)).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${pts[i].l}</text>`});

  const diff=Math.round((new Date(y,m-1,dd)-new Date(...now.split('-').map((n,i)=>i===1?n-1:+n)))/864e5);
  const tag=diff<0?['bad','En retard de '+(-diff)+' j']:diff===0?['warn',"Aujourd'hui"]:diff===1?['warn','Demain · rappel à envoyer']:diff<=5?['warn','Dans '+diff+' jours · rappel à envoyer']:null;

}

const stack=[];
function sheet(title,html,mount){
  const el=document.createElement('div');el.className='sheet';
  el.innerHTML=`<div class="wrap"><header><h2>${esc(title)}</h2><button class="x" aria-label="Fermer">✕</button></header><div class="body">${html}</div></div>`;
  const o={el,close(){el.remove();stack.splice(stack.indexOf(o),1);top_=stack[stack.length-1]||null},refresh:null};
  $('.x',el).onclick=()=>o.close();
  $('#layer').appendChild(el);stack.push(o);top_=o;if(mount)mount(el,o);return o;
}

const val=(el,id)=>($('#'+id,el)||{}).value||'';
const num=(el,id)=>Math.max(0,Math.round(Number(String(val(el,id)).replace(/\s/g,'').replace(',','.'))||0));

function openClientForm(id){
  const c=id?byId(S.clients,id):null;
  sheet(c?'Modifier le client':'Nouveau client',`
    <label for="cn">Nom complet *</label><div style="display:flex;gap:8px"><input id="cn" value="${esc(c&&c.name)}" autocomplete="off" autocapitalize="words" style="flex:1;min-width:0">${speechAPI()?'<button type="button" class="btn sec2 sm" id="cmic" aria-label="Dire le nom" style="flex:none">🎤 Dire</button>':''}</div>
    ${c&&c.nameVoice?`<audio controls src="${c.nameVoice}" style="width:100%;margin-top:6px"></audio>`:''}
    <label for="cp">Téléphone</label><input id="cp" type="tel" inputmode="tel" value="${esc(c&&c.phone)}">
    <label for="cv">Ville ou commune</label><input id="cv" list="villes" value="${esc(c&&c.city)}" placeholder="Ex. Dakar, Thiès, Touba"><datalist id="villes"><option>Dakar</option><option>Pikine</option><option>Guédiawaye</option><option>Rufisque</option><option>Thiès</option><option>Mbour</option><option>Touba</option><option>Diourbel</option><option>Kaolack</option><option>Saint-Louis</option><option>Ziguinchor</option><option>Louga</option><option>Tambacounda</option><option>Kolda</option></datalist>
    <label for="ca">Quartier et adresse</label><input id="ca" value="${esc(c&&c.address)}" placeholder="Ex. Parcelles Assainies, Unité 15, villa 120">
    <label for="cm">Point de repère</label><input id="cm" value="${esc(c&&c.landmark)}" placeholder="Ex. en face de la pharmacie">
    <label for="cl">Position sur la carte (lien Google Maps)</label><input id="cl" type="url" inputmode="url" value="${esc(c&&c.geo)}" placeholder="https://maps.app.goo.gl/…">
    <p class="note">Sur place, ouvrez Google Maps, touchez votre position, choisissez Partager puis Copier le lien, et collez-le ici.</p>
    <label for="cj">Profession</label><input id="cj" value="${esc(c&&c.job)}">
    <label for="ci">Pièce d'identité (facultatif)</label><input id="ci" value="${esc(c&&c.idno)}">
    <p class="note" id="dup"></p><div style="height:14px"></div><button class="btn" id="ok">Enregistrer</button>`,(el,o)=>{
    const cm=$('#cmic',el);if(cm)cm.onclick=()=>listenName(cm,t=>{$('#cn',el).value=t;$('#dup',el).textContent=''},m=>{$('#dup',el).textContent=m});
    $('#ok',el).onclick=async()=>{
      const name=val(el,'cn').trim();if(!name){$('#dup',el).textContent='Le nom est obligatoire.';return}
      const phone=val(el,'cp').trim();const geo=val(el,'cl').trim();
      if(geo&&!/^https?:\/\//i.test(geo)){$('#dup',el).textContent='Le lien de localisation doit commencer par https://';return}
      const dup=S.clients.find(x=>x.id!==(c&&c.id)&&phone&&x.phone===phone);
      if(dup&&!el.dataset.sure){$('#dup',el).textContent='Attention : '+dup.name+' a déjà ce numéro. Touchez encore « Enregistrer » pour créer quand même.';el.dataset.sure=1;return}
      const nid=c?c.id:uid('c');
      await put('clients',nid,{...(c||{}),name,phone,city:val(el,'cv').trim(),address:val(el,'ca').trim(),landmark:val(el,'cm').trim(),geo,job:val(el,'cj').trim(),idno:val(el,'ci').trim(),created:c?c.created:today(),agent:c?c.agent:ME.id,incomplete:/^Client\s/.test(name),nameVoice:/^Client\s/.test(name)?((c&&c.nameVoice)||''):''});
      toast('Client enregistré');o.close();if(!c&&o.after)o.after(nid);
    };
  });
}
function openClient(id){
  const c=byId(S.clients,id);if(!c)return;
  const o=sheet(c.name,'',(el,o)=>{o.refresh=()=>draw()});
  function draw(){
    const cc=byId(S.clients,id);if(!cc){o.close();return}
    const P=pays(),now=today();
    const L=S.sales.filter(s=>s.clientId===id&&!isCancelled(s)).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>({s,st:saleState(s,P,now)}));
    const owed=L.reduce((a,x)=>a+x.st.balance,0);
    setBody(o,`${cc.nameVoice?`<div class="card" style="margin-bottom:10px"><b>Nom dit à la voix par l'employé</b><audio controls src="${cc.nameVoice}" style="width:100%;margin-top:8px"></audio><p class="note" style="margin:6px 0 0">Écoute, puis touche « Modifier » pour écrire le nom.</p></div>`:''}<div class="card"><div class="tot"><span>Téléphone</span><b>${esc(cc.phone||'—')}</b></div><div class="tot"><span>Ville</span><b style="text-align:right">${esc(cc.city||'—')}</b></div><div class="tot"><span>Adresse</span><b style="text-align:right">${esc(cc.address||'—')}</b></div>${cc.landmark?`<div class="tot"><span>Repère</span><b style="text-align:right">${esc(cc.landmark)}</b></div>`:''}<div class="tot"><span>Profession</span><b>${esc(cc.job||'—')}</b></div><div class="tot g"><span>Reste à payer</span><span>${money(owed)}</span></div></div>
    ${phoneIntl(cc.phone)?`<div class="acts" style="margin-top:10px"><a href="tel:+${phoneIntl(cc.phone)}">Appeler</a><a class="wa" href="https://wa.me/${phoneIntl(cc.phone)}" target="_blank" rel="noopener">WhatsApp</a><button type="button" data-copy="${esc(cc.name+' +'+phoneIntl(cc.phone))}">Contact</button></div>`:''}
    ${cc.geo||cc.address||cc.city?`<a class="btn sec2" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="${esc(cc.geo||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([cc.address,cc.city,'Sénégal'].filter(Boolean).join(', '))))}">${cc.geo?'Ouvrir la position du client':'Chercher l\'adresse sur la carte'}</a>`:'<p class="note">Aucune localisation. Touchez « Modifier » pour l\'ajouter.</p>'}
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="ns">Nouvelle vente</button><button class="btn line" id="ed">Modifier</button></div>
    <div class="sec"><h2>Historique</h2><span>${L.length}</span></div>
    <div class="list">${L.length?L.map(x=>`<div class="row" data-sale="${x.s.id}"><div class="l"><b>${esc(ref(x.s))}</b><small>${fdate(x.s.date)} · ${trLabel(x.s)} · ${esc(sellerOf(x.s))}</small></div><div class="r"><b>${money(x.s.total)}</b><span class="pill ${stPill(x.st.status)}">${x.st.status}</span></div></div>`).join(''):'<div class="empty">Aucun achat.</div>'}</div>`);
    $('#ns',o.el).onclick=()=>openNewSale(id);$('#ed',o.el).onclick=()=>openClientForm(id);
    o.el.querySelectorAll('[data-sale]').forEach(r=>r.onclick=()=>openSale(r.dataset.sale));
  }
  draw();
}
function openProductForm(id){
  const p=id?byId(S.products,id):null,cost=id?byId(S.costs,id):null;
  sheet(p?'Modifier le produit':'Nouveau produit',`
    <label for="pn">Nom du produit *</label><input id="pn" value="${esc(p&&p.name)}">
    <label for="ph">Photo du produit</label>
    <div style="display:flex;gap:12px;align-items:center"><img id="pv" class="th" style="width:72px;height:72px;margin:0;${p&&p.img?'':'display:none'}" ${p&&p.img?`src="${p.img}"`:''} alt=""><input id="ph" type="file" accept="image/*" style="flex:1;min-width:0"></div>
    <label for="pr">Référence</label><input id="pr" value="${esc(p&&p.ref)}">
    <div class="grid2"><div><label for="pp">Prix comptant (FCFA) *</label><input id="pp" inputmode="numeric" value="${p?p.price:''}"></div>
    <div><label for="pc">Prix à crédit (FCFA)</label><input id="pc" inputmode="numeric" value="${p&&p.creditPrice||''}" placeholder="Idem comptant"></div></div>
    <div class="grid2"><div><label for="pa">Prix d'achat (FCFA)</label><input id="pa" inputmode="numeric" value="${cost?cost.cost:''}"></div>
    <div><label for="pt">Seuil d'alerte</label><input id="pt" inputmode="numeric" value="${p?p.alert:2}"></div></div>
    ${p?'':'<label for="pq">Quantité en stock au départ</label><input id="pq" inputmode="numeric" value="0">'}
    <p class="note" id="err"></p><div style="height:14px"></div><button class="btn" id="ok">Enregistrer</button>`,(el,o)=>{
    let img=p&&p.img||'';
    $('#ph',el).onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{img=await readImage(f);const pv=$('#pv',el);pv.src=img;pv.style.display='block'}catch(x){$('#err',el).textContent='Photo illisible. Choisissez une autre image.'}};
    $('#ok',el).onclick=async()=>{
      const name=val(el,'pn').trim(),price=num(el,'pp');
      if(!name||!price){$('#err',el).textContent='Le nom et le prix comptant sont obligatoires.';return}
      const nid=p?p.id:uid('p');
      await put('products',nid,{name,ref:val(el,'pr').trim(),price,creditPrice:num(el,'pc')||price,alert:num(el,'pt'),img});
      await put('costs',nid,{cost:num(el,'pa')});
      if(!p&&num(el,'pq'))await put('moves',uid('m'),{productId:nid,qty:num(el,'pq'),type:'entrée',date:today(),note:'Stock initial',agent:ME.id});
      toast('Produit enregistré');o.close();
    };
  });
}
function openProduct(id){
  const p=byId(S.products,id);if(!p)return;
  const o=sheet(p.name,'',(el,o)=>{o.refresh=draw});
  function draw(){
    const pp=byId(S.products,id);if(!pp){o.close();return}
    const M=S.moves.filter(m=>m.productId===id).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
    const cost=byId(S.costs,id);
    setBody(o,`${pp.img?`<img class="pimg" src="${pp.img}" alt="">`:''}<div class="card"><div class="tot"><span>En stock</span><b>${stockOf(id)}</b></div><div class="tot"><span>Prix comptant</span><b>${money(pp.price)}</b></div><div class="tot"><span>Prix à crédit</span><b>${money(pp.creditPrice||pp.price)}</b></div>${ME.isAdmin&&cost?`<div class="tot"><span>Prix d'achat</span><b>${money(cost.cost)}</b></div>`:''}</div>
    ${ME.isAdmin?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="mv">Entrée / correction</button><button class="btn line" id="ed">Modifier</button></div>`:''}
    <div class="sec"><h2>Mouvements</h2><span>${M.length}</span></div>
    <div class="scroll"><table class="tbl"><tbody>${M.length?M.map(m=>`<tr><td>${fdate(m.date)}</td><td>${esc(m.type)}${m.note?' · '+esc(m.note):''}</td><td class="n"><b style="color:var(--${m.qty<0?'bad':'ok'})">${m.qty>0?'+':''}${m.qty}</b></td></tr>`).join(''):'<tr><td>Aucun mouvement.</td></tr>'}</tbody></table></div>`);
    if(ME.isAdmin){$('#ed',o.el).onclick=()=>openProductForm(id);$('#mv',o.el).onclick=()=>openMove(id)}
  }
  draw();
}
function openMove(pid){
  sheet('Mouvement de stock',`
    <div class="seg" id="mt"><button data-v="entrée" aria-pressed="true">Entrée</button><button data-v="sortie" aria-pressed="false">Sortie</button><button data-v="correction" aria-pressed="false">Inventaire</button></div>
    <label for="mq">Quantité</label><input id="mq" inputmode="numeric" value="1">
    <label for="mn">Note</label><input id="mn" placeholder="Fournisseur, retour, casse…">
    <p class="note" id="mh">Ajoute au stock.</p><div style="height:14px"></div><button class="btn" id="ok">Enregistrer</button>`,(el,o)=>{
    let t='entrée';const hint={entrée:'Ajoute au stock.',sortie:'Retire du stock.',correction:'Saisissez la quantité comptée. Le stock sera aligné dessus.'};
    el.querySelectorAll('#mt button').forEach(b=>b.onclick=()=>{t=b.dataset.v;el.querySelectorAll('#mt button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#mh',el).textContent=hint[t]});
    $('#ok',el).onclick=async()=>{
      const q=num(el,'mq');if(t!=='correction'&&!q)return;
      const cur=stockOf(pid);const qty=t==='entrée'?q:t==='sortie'?-q:q-cur;if(!qty){o.close();return}
      await put('moves',uid('m'),{productId:pid,qty,type:t==='correction'?'inventaire':t,date:today(),note:val(el,'mn').trim(),agent:ME.id});
      await logAct(t==='correction'?'Inventaire':'Mouvement de stock',(byId(S.products,pid)||{}).name+' : '+(qty>0?'+':'')+qty);toast('Stock mis à jour');o.close();
    };
  });
}

    const L=S.staff.slice().sort((a,b)=>a.name.localeCompare(b.name));
    setBody(o,`<p class="note" style="margin-top:0">Ces noms apparaissent comme vendeur sur chaque vente et sur les factures.</p>
    <label for="en">Nom de l'employé</label><input id="en" autocomplete="off"><label for="et">Téléphone (facultatif)</label><input id="et" type="tel" inputmode="tel">
    <div style="height:12px"></div><button class="btn" id="add">Ajouter</button>
    <div class="sec"><h2>Équipe</h2><span>${L.filter(x=>x.active!==false).length}</span></div>
    <div class="list">${L.length?L.map(x=>`<div class="row" style="cursor:default"><div class="l"><b>${esc(x.name)}</b><small>${esc(x.phone?phoneShow(x.phone):'Sans téléphone')}</small></div><div class="r"><button class="btn sm ${x.active===false?'sec2':'danger'}" data-tg="${x.id}">${x.active===false?'Réactiver':'Retirer'}</button></div></div>`).join(''):'<div class="empty">Aucun employé. Ajoutez le premier ci-dessus.</div>'}</div>`);
    $('#add',o.el).onclick=async()=>{const n=val(o.el,'en').trim();if(!n)return;await put('staff',uid('e'),{name:n,phone:val(o.el,'et').trim(),active:true});toast('Employé ajouté')};
    o.el.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const x=byId(S.staff,b.dataset.tg);await put('staff',x.id,{name:x.name,phone:x.phone||'',active:x.active===false})});

function openNewBook(){
  const names=staffNames();
  const o=sheet('Nouvelle facture',names.length?`<label for="no">Agent propriétaire de cette facture</label><select id="no"><option value="${ME.id||''}">Moi (directeur)</option></select><p class="note" id="nz" style="margin-top:6px"></p>
  <p class="note" id="nn" style="margin-top:0"></p>
  <label for="nc">Chef qui gère cette facture</label><select id="nc">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
  <label for="nt">Téléphone du chef (obligatoire)</label><input id="nt" inputmode="tel" placeholder="77 123 45 67"><p class="note" id="err" style="color:var(--bad)"></p><div style="height:14px"></div><button class="btn" id="ok">Créer la facture</button>`:'<div class="empty">Ajoutez d\'abord vos employés (Plus, « Employés »).</div>',(el,o)=>{
    const ok=$('#ok',el);if(!ok)return;
    const no=$('#no',el),nc=$('#nc',el),nt=$('#nt',el);
    Object.keys(PROF).filter(i=>i!==ME.id&&PROF[i].role!=='admin'&&PROF[i].active).forEach(i=>{const op=document.createElement('option');op.value=i;op.textContent=PROF[i].name+(PROF[i].zone?' · '+PROF[i].zone:'');no.appendChild(op)});
    const note=()=>{$('#nn',el).textContent='La facture F'+nextFnum(no.value)+' de cet agent aura '+PAGES+' pages, attribuées automatiquement à ses ventes.'};no.onchange=note;note();
    const fill=()=>{const x=S.staff.find(q=>q.name===nc.value);nt.value=x&&x.phone?phoneShow(x.phone):''};nc.onchange=fill;fill();
    ok.onclick=async()=>{if(!okTel(nt.value)){$('#err',el).textContent='Le numéro de téléphone du chef de facture est obligatoire.';return}const ow_=no.value,n=nextFnum(ow_);ok.disabled=true;await put('invoices',bkey(ow_,n),{num:n,owner:ow_,chief:val(el,'nc'),chiefTel:nt.value.trim(),created:today()});toast('Facture F'+n+' créée');o.close()};
  });
}
function openBook(n,o_){
  o_=o_||'';
  const o=sheet('Facture F'+n,'',(el,o)=>{o.refresh=draw});
  function draw(){
    const b=books(o_).find(x=>x.num===n);if(!b){o.close();return}
    const P=pays(),now=today();
    const rows=S.sales.filter(s=>s.fnum===n&&ow(s)===o_&&!isCancelled(s)).sort((a,b)=>a.page-b.page).map(s=>({s,c:byId(S.clients,s.clientId),st:saleState(s,P,now)}));
    const used=usedPages(n,o_);const free=[];for(let p=1;p<=PAGES;p++)if(!used.has(p))free.push(p);
    const ranges=[];free.forEach(p=>{const l=ranges[ranges.length-1];if(l&&l[1]===p-1)l[1]=p;else ranges.push([p,p])});
    const names=staffNames();if(b.chief&&!names.includes(b.chief))names.push(b.chief);
    setBody(o,`<div class="card">${o_?`<div class="tot"><span>Agent</span><b>${esc(ownerName(o_))}${ownerZone(o_)?' · '+esc(ownerZone(o_)):''}</b></div>`:''}<div class="tot"><span>Chef de la facture</span><b>${esc(b.chief||'Non défini')}</b></div>
      <div class="tot"><span>Téléphone du chef</span><b>${esc(chiefTelOf(n,o_)?phoneShow(chiefTelOf(n,o_)):'À renseigner')}</b></div>
      ${ME.isAdmin?`<label for="bt">Modifier le téléphone du chef</label><div style="display:flex;gap:8px"><input id="bt" inputmode="tel" value="${esc(chiefTelOf(n,o_))}"><button class="btn sm" id="st2" style="flex:none">Enregistrer</button></div>`:''}
      <div class="tot"><span>Pages utilisées</span><b>${b.used} / ${PAGES}</b></div><div class="bar" aria-hidden="true"><i style="width:${Math.round(b.used/PAGES*100)}%"></i></div>
      <p class="note">${free.length?'Pages libres : '+ranges.map(r=>r[0]===r[1]?'P'+r[0]:'P'+r[0]+' à P'+r[1]).join(', '):'Facture complète.'}</p>
      ${ME.isAdmin&&names.length?`<label for="bc">Changer le chef</label><div style="display:flex;gap:8px"><select id="bc">${names.map(x=>`<option ${x===b.chief?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn sm" id="sc2" style="flex:none">Enregistrer</button></div>`:''}</div>
    <div class="sec"><h2>Clients et pages</h2><span>${rows.length}</span></div>
    <div class="list">${rows.length?rows.map(x=>`<div class="row" data-sale="${x.s.id}"><div class="l"><b>P${x.s.page} · ${esc(x.c?x.c.name:'Client')}</b><small>${fdate(x.s.date)} · ${esc(trLabel(x.s))} · ${esc(sellerOf(x.s))}</small></div><div class="r"><b>${money(x.s.total)}</b><span class="pill ${stPill(x.st.status)}">${x.st.status}</span></div></div>`).join(''):'<div class="empty">Aucune page utilisée.</div>'}</div>`);
    o.el.querySelectorAll('[data-sale]').forEach(r=>r.onclick=()=>openSale(r.dataset.sale));
    const st2=$('#st2',o.el);if(st2)st2.onclick=async()=>{const t=val(o.el,'bt').trim();if(!okTel(t)){toast('Numéro obligatoire (9 chiffres)');return}await put('invoices',bkey(o_,n),{...(bookOf(n,o_)||{num:n,owner:o_,created:today()}),chiefTel:t});toast('Téléphone enregistré')};
    const sc=$('#sc2',o.el);if(sc)sc.onclick=async()=>{const nm=val(o.el,'bc'),x=S.staff.find(q=>q.name===nm);const cur=bookOf(n,o_)||{num:n,owner:o_,created:today()};const typed=val(o.el,'bt').trim(),tel=(x&&x.phone)||(typed!==chiefTelOf(n,o_)?typed:'');if(!okTel(tel)){toast('Saisissez le téléphone du nouveau chef puis réessayez');return}await put('invoices',bkey(o_,n),{...cur,chief:nm,chiefTel:tel});await logAct('Chef de facture changé','F'+n+' : '+(b.chief||'—')+' → '+val(o.el,'bc'));toast('Chef enregistré')};
  }
  draw();
}

const bk_=v=>{const i=String(v).indexOf('|');return{o:v.slice(0,i),n:Number(v.slice(i+1))}};
function openNewSale(clientId){
  if(!S.products.length){toast('Ajoutez d\'abord des produits (onglet Stock)');return}
  const w={clientId:clientId||'',lines:[{pid:'',qty:1,price:null}],type:'cash',sched:[]};
  sheet('Nouvelle vente',`
    <label for="sc">Client *</label><select id="sc"></select>
    <label for="sv">Employé qui a vendu *</label><select id="sv"></select>
    <label for="sb">Facture</label><select id="sb"></select>
    <div id="nbx" hidden><label for="sch">Chef de la nouvelle facture</label><select id="sch"></select><label for="nct">Téléphone du chef (obligatoire)</label><input id="nct" inputmode="tel" placeholder="77 123 45 67"></div><div id="nbt" hidden><label for="nbp">Téléphone du chef de cette facture (obligatoire)</label><input id="nbp" inputmode="tel" placeholder="77 123 45 67"></div>
    <p class="note" id="sbh"></p>
    <div class="sec" style="margin-top:14px"><h2>Produits</h2></div><div id="lines"></div>
    <button class="btn sec2 sm" id="addl" type="button">+ Ajouter un produit</button>

    <div id="cred" hidden>
      <div class="grid2"><div><label for="sa">Acompte (FCFA)</label><input id="sa" inputmode="numeric" value="0"></div>
      <div><label for="sd">Date de la vente</label><input id="sd" type="date" value="${today()}"></div></div>
      <div class="grid2"><div><label for="sn">Nombre de tranches</label><select id="sn">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===3?'selected':''}>${n} tranche${n>1?'s':''}</option>`).join('')}</select></div>
      <div><label for="si">Écart entre tranches</label><select id="si"><option value="m1">1 mois</option><option value="d15">15 jours</option><option value="d30">30 jours</option><option value="d7">7 jours</option></select></div></div>
      <label for="sf">Date du 1er paiement</label><input id="sf" type="date" value="${addMonths(today(),1)}">
      <p class="note">Les autres dates se calculent à partir de la première. Vous pouvez ensuite changer chaque date et chaque montant.</p>
      <div id="tr"></div>
    </div>
    <div class="grid2"><div><label for="mm">Moyen de paiement</label><select id="mm">${methodOpts()}</select></div>
    <div><label for="mr">Référence transaction</label><input id="mr" placeholder="Facultatif"></div></div>
    <div class="card" style="margin-top:14px" id="sum"></div>
    <p class="note" id="err" style="color:var(--bad)"></p>
    <div style="height:10px"></div><button class="btn" id="ok">Valider la vente</button>`,(el,o)=>{
    const sel=$('#sc',el);
    const fillClients=(pick)=>{sel.innerHTML='<option value="">Choisir un client…</option>'+S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')+'<option value="__new">+ Nouveau client</option>';sel.value=pick||'';w.clientId=sel.value};
    const sv=$('#sv',el);
    function fillSellers(keep){
      const names=S.staff.filter(x=>x.active!==false).map(x=>x.name);
      if(!ME.isAdmin&&ME.name&&!names.includes(ME.name))names.push(ME.name);
      const pick=keep||(!ME.isAdmin&&ME.name?ME.name:'');
      sv.innerHTML='<option value="">Choisir l\'employé…</option>'+names.map(n=>`<option ${n===pick?'selected':''}>${esc(n)}</option>`).join('')+(ME.isAdmin?'<option value="__new">+ Ajouter un employé</option>':'');
      if(pick&&names.includes(pick))sv.value=pick;
    }
    sv.onchange=()=>{if(sv.value==='__new'){sv.value='';openStaff()}};
    sv.onfocus=()=>{if(sv.value!=='__new')fillSellers(sv.value)};
    fillSellers();
    const sb=$('#sb',el),sch=$('#sch',el);
    function fillBooks(keep){
      const B=books().filter(b=>b.open).sort((a,b)=>b.num-a.num);
      sb.innerHTML=B.map(b=>`<option value="${b.owner}|${b.num}">F${b.num}${ME.isAdmin&&b.owner?' ('+esc(ownerName(b.owner))+')':''} · chef ${esc(b.chief||'—')} · ${b.used}/${PAGES} pages</option>`).join('')+`<option value="new">Nouvelle facture (F${nextFnum(ME.id)})</option>`;
      sb.value=keep&&[...sb.options].some(o=>o.value===keep)?keep:(B.length?B[0].owner+'|'+B[0].num:'new');
      const names=staffNames();const prev=B.length?B[0].chief:'';
      sch.innerHTML=names.map(n=>`<option ${n===(prev||sv.value)?'selected':''}>${esc(n)}</option>`).join('');
      $('#nbx',el).hidden=sb.value!=='new'||!names.length;
      const stf=S.staff.find(x=>x.name===sch.value);if(sb.value==='new'&&!$('#nct',el).value&&stf&&stf.phone)$('#nct',el).value=phoneShow(stf.phone);
      $('#nbt',el).hidden=sb.value==='new'||!!chiefTelOf(bk_(sb.value).n,bk_(sb.value).o);
      $('#sbh',el).textContent=sb.value==='new'?'La page P1 sera attribuée automatiquement.':'Page attribuée automatiquement : P'+nextPage(bk_(sb.value).n,bk_(sb.value).o)+' (la facture compte '+PAGES+' pages au maximum).';
    }
    sch.onchange=()=>{const x=S.staff.find(q=>q.name===sch.value);$('#nct',el).value=x&&x.phone?phoneShow(x.phone):''};
    sb.onchange=()=>fillBooks(sb.value);sb.onfocus=()=>fillBooks(sb.value);
    fillBooks();
    fillClients(w.clientId);
    sel.onchange=()=>{if(sel.value==='__new'){openClientFormThen(id=>setTimeout(()=>fillClients(id),500));sel.value=''}w.clientId=sel.value};
    const catalog=p=>w.type==='credit'?(p.creditPrice||p.price):p.price;
    // Le dirigeant peut changer le prix d'une ligne ; sinon le prix du catalogue (comptant ou crédit) s'applique.
    const unit=l=>{const p=byId(S.products,l.pid);return l.price!=null?l.price:(p?catalog(p):0)};
    const total=()=>w.lines.reduce((a,l)=>a+unit(l)*l.qty,0);
    function drawLines(){
      $('#lines',el).innerHTML=w.lines.map((l,i)=>{const p=byId(S.products,l.pid);const cat=p?catalog(p):0;return `<div style="margin-bottom:12px"><div class="line-item" style="margin-bottom:6px"><select data-i="${i}" data-k="pid" aria-label="Produit"><option value="">Produit…</option>${S.products.map(q=>`<option value="${q.id}" ${q.id===l.pid?'selected':''}>${esc(q.name)} (${stockOf(q.id)})</option>`).join('')}</select><input data-i="${i}" data-k="qty" inputmode="numeric" value="${l.qty}" aria-label="Quantité"><button class="x" data-rm="${i}" type="button" aria-label="Retirer" ${w.lines.length<2?'disabled':''}>−</button></div>
      ${p?`<div style="display:flex;gap:8px;align-items:center"><label style="margin:0;flex:none" for="pu${i}">Prix unitaire</label><input id="pu${i}" data-i="${i}" data-k="price" inputmode="numeric" value="${unit(l)}" ${ME.isAdmin?'':'readonly'} aria-label="Prix unitaire"></div>${l.price!=null&&l.price!==cat?`<p class="note" style="margin:4px 0 0">Prix catalogue ${w.type==='credit'?'à crédit':'comptant'} : ${money(cat)}</p>`:''}`:''}</div>`}).join('');
      el.querySelectorAll('#lines [data-k]').forEach(inp=>inp.onchange=inp.oninput=()=>{
        const l=w.lines[inp.dataset.i],k=inp.dataset.k;
        if(k==='qty')l.qty=Math.max(1,parseInt(inp.value)||1);
        else if(k==='price'){const v=Math.max(0,Math.round(Number(String(inp.value).replace(/\s/g,''))||0));l.price=v}
        else{l.pid=inp.value;l.price=null}
        regen();if(k==='pid')drawLines();
      });
      el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{w.lines.splice(b.dataset.rm,1);drawLines();regen()});
    }
    const stepOf=()=>{const v=val(el,'si')||'m1';return v[0]==='m'?{m:Number(v.slice(1))}:{d:Number(v.slice(1))}};
    // Recalcule les tranches proposées (remet les montants à égalité) quand le total, l'acompte, le nombre, l'écart ou la 1re date changent.
    function regen(){
      const t=total(),dep=Math.min(num(el,'sa'),t);
      w.sched=w.type==='credit'?buildSchedule(t,dep,Number(val(el,'sn'))||3,val(el,'sf')||addMonths(today(),1),stepOf()):[];
      drawTr();sum();
    }
    function drawTr(){
      const box=$('#tr',el);
      box.innerHTML=w.sched.map((e,i)=>`<div class="grid2" style="grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);align-items:center;margin-bottom:8px"><b>${e.n}</b><input type="date" data-i="${i}" data-k="due" value="${e.due}" aria-label="Date de la tranche ${e.n}"><input inputmode="numeric" data-i="${i}" data-k="amount" value="${e.amount}" aria-label="Montant de la tranche ${e.n}"></div>`).join('');
      box.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const e=w.sched[inp.dataset.i];if(inp.dataset.k==='due')e.due=inp.value;else e.amount=Math.max(0,Math.round(Number(String(inp.value).replace(/\s/g,''))||0));sum()});
    }
    function calc(){
      const t=total();const dep=w.type==='credit'?Math.min(num(el,'sa'),t):t;
      const left=t-dep-w.sched.reduce((a,e)=>a+e.amount,0);
      return{t,dep,sched:w.sched,left};
    }
    function sum(){
      const{t,dep,left}=calc();
      $('#sum',el).innerHTML=`<div class="tot"><span>Total</span><b>${money(t)}</b></div>`+(w.type==='credit'?`<div class="tot"><span>Acompte</span><b>${money(dep)}</b></div><div class="tot g"><span>Reste à payer</span><span>${money(t-dep)}</span></div>${left!==0?`<p class="note" style="color:var(--bad)">${left>0?'Il reste '+money(left)+' à répartir sur les tranches.':'Les tranches dépassent le reste de '+money(-left)+'.'}</p>`:''}`:`<div class="tot g"><span>À encaisser</span><span>${money(t)}</span></div>`);
    }
    el.querySelectorAll('#ty button').forEach(b=>b.onclick=()=>{w.type=b.dataset.v;el.querySelectorAll('#ty button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#cred',el).hidden=w.type!=='credit';drawLines();regen()});
    ['sa','sn','si','sf'].forEach(i=>{const n=$('#'+i,el);n.oninput=n.onchange=regen});
    $('#addl',el).onclick=()=>{w.lines.push({pid:'',qty:1,price:null});drawLines()};
    drawLines();regen();
    $('#ok',el).onclick=async()=>{
      const err=$('#err',el);err.textContent='';
      if(!w.clientId||w.clientId==='__new'){err.textContent='Choisissez un client.';return}
      const seller=val(el,'sv');
      if(!seller||seller==='__new'){err.textContent='Choisissez l\'employé qui a vendu.';return}
      const L=w.lines.filter(l=>l.pid);if(!L.length){err.textContent='Ajoutez au moins un produit.';return}
      if(L.some(l=>unit(l)<=0)){err.textContent='Chaque produit doit avoir un prix supérieur à 0.';return}
      const need={};L.forEach(l=>need[l.pid]=(need[l.pid]||0)+l.qty);
      for(const pid in need){if(need[pid]>stockOf(pid)){err.textContent='Stock insuffisant : '+byId(S.products,pid).name+' ('+stockOf(pid)+' disponible).';return}}
      const{t,dep,sched,left}=calc();
      if(w.type==='credit'){
        if(!sched.length){err.textContent='Le crédit doit avoir un reste à payer. Réduisez l\'acompte.';return}
        if(left!==0){err.textContent='Le total des tranches doit être égal au reste à payer.';return}
        if(sched.some(e=>!e.due||e.amount<=0)){err.textContent='Chaque tranche doit avoir une date et un montant.';return}
        const ds=sched.map(e=>e.due);if(ds.some((d,i)=>i&&d<ds[i-1])){err.textContent='Les dates des tranches doivent se suivre dans l\'ordre.';return}
      }
      const date=w.type==='credit'?(val(el,'sd')||today()):today();
      const isNew=sb.value==='new',telV=(isNew?val(el,'nct'):val(el,'nbp')).trim();
      if((isNew||!chiefTelOf(bk_(sb.value).n,bk_(sb.value).o))&&!okTel(telV)){err.textContent='Le numéro de téléphone du chef de facture est obligatoire.';return}
      const sorted=sched.map((e,i)=>({n:i+1,due:e.due,amount:e.amount}));
      const sid=uid('s'),num_=nextNumber('V');
      $('#ok',el).disabled=true;
      const lines=L.map(l=>{const p=byId(S.products,l.pid);return{productId:p.id,name:p.name,qty:l.qty,price:unit(l),listPrice:catalog(p)}});
      let slot;
      try{const pb=sb.value==='new'?{n:null,o:ME.id||''}:bk_(sb.value),prefB=pb.n;const inherit=sb.value==='new'?(sch.value||seller):((bookOf(prefB,pb.o)||{}).chief||seller);if(prefB!=null&&!chiefTelOf(prefB,pb.o)){const bk=bookOf(prefB,pb.o)||{num:prefB,owner:pb.o,created:today()};await put('invoices',bkey(pb.o,prefB),{...bk,chiefTel:telV})}slot=await takePage(prefB,inherit,sid,telV,pb.o)}
      catch(e){console.warn('takePage',e);err.textContent='Impossible d\'attribuer une page de facture. '+whyFail(e);$('#ok',el).disabled=false;return}
      await put('sales',sid,{number:num_,date,clientId:w.clientId,agent:ME.id,byAdmin:ME.isAdmin,fnum:slot.f,page:slot.p,owner:slot.o,seller,lines,total:t,type:w.type,deposit:dep,months:sorted.length,schedule:sorted,created:new Date().toISOString()});
      const method=val(el,'mm'),ref=val(el,'mr').trim();
      const amt=w.type==='credit'?dep:t;
      if(amt>0)await put('payments',uid('y'),{number:nextNumber('R'),saleId:sid,clientId:w.clientId,amount:amt,kind:w.type==='credit'?'acompte':'comptant',method,ref,collector:ME.isAdmin?DIRECT:seller,date:today(),time:new Date().toISOString(),agent:ME.id,byAdmin:ME.isAdmin});
      for(const l of lines)if(l.listPrice!==l.price)await logAct('Prix modifié',ref_(slot)+' · '+l.name+' : '+money(l.listPrice)+' → '+money(l.price));
      for(const l of lines)await put('moves',uid('m'),{productId:l.productId,qty:-l.qty,type:'vente',date:today(),note:num_,agent:ME.id});
      toast('Vente enregistrée · F'+slot.f+'P'+slot.p);o.close();openSale(sid);
    };
  });
}
function openClientFormThen(cb){openClientForm();const o=stack[stack.length-1];o.after=cb;return o}

/* ========= Détail d'une vente, paiements, annulations ========= */
function openSale(id){

      <div class="scroll"><table class="tbl"><tbody>${s.lines.map(l=>`<tr><td>${esc(l.name)}</td><td class="n">${l.qty} × ${nf.format(l.price).replace(/[  ]/g,' ')}${l.listPrice&&l.listPrice!==l.price?'<br><small style="color:var(--mute)">catalogue '+money(l.listPrice)+'</small>':''}</td><td class="n">${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table></div>

    ${st.balance>0&&!canc?`<div class="sec"><h2>Encaisser un paiement</h2></div><div class="card">

      <div class="grid2"><div><label for="pm">Moyen</label><select id="pm">${methodOpts()}</select></div><div><label for="pr">Référence</label><input id="pr" placeholder="Facultatif"></div></div>

function openPayment(pid){

    const cx=$('#cx',o.el);

  }
  draw();
}
function invoiceText(s,c,st){
  const ch=chiefInfo(s),co=comp();
  let t='*FACTURE '+ref(s)+' — SenAfterPay*\nClient : '+(c?c.name:'')+'\nDate : '+fdate(s.date)+'\n';
  t+=s.lines.map(l=>l.qty+' x '+l.name+' : '+money(l.price*l.qty)).join('\n')+'\n*Total : '+money(s.total)+'*\n';
  if(s.type==='credit')t+='Paiement à crédit :\n'+s.schedule.map(e=>'- Tranche '+e.n+' : '+money(e.amount)+' le '+fdate(e.due)).join('\n')+'\n';
  else t+='Paiement : comptant\n';
  t+='Reste à payer : '+money(st.balance)+'\nChef de facture : '+[ch.prenom,ch.nom].filter(Boolean).join(' ')+(ch.tel?' ('+ch.tel+')':'')+'\nEmployé : '+sellerOf(s)+'\n';
  if(co.phone)t+='Contact : '+co.phone+'\n';
  return t+'Merci de votre confiance.';
}

    const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const J=window.jspdf.jsPDF,pdf=new J({unit:'mm',format:'a4'});
    const W=210,H=297,m=8,w=W-2*m,ph=(H-2*m),imgH=cv.height*w/cv.width;
    let y=0;
    while(y<imgH-0.5){
      const sliceH=Math.min(ph,imgH-y);
      const c2=document.createElement('canvas');c2.width=cv.width;c2.height=Math.round(sliceH*cv.width/w);
      c2.getContext('2d').drawImage(cv,0,Math.round(y*cv.width/w),cv.width,c2.height,0,0,cv.width,c2.height);
      if(y>0)pdf.addPage();
      pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',m,m,w,sliceH);
      y+=ph;
    }
    const buf=pdf.output('arraybuffer');
    const d=await claude.use('downloads');if(!d)throw new Error('nodl');
    await d.save({filename:name,data:buf});toast('PDF enregistré — prêt à imprimer ou à envoyer');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('PDF indisponible, enregistrement du fichier…');saveFile(name.replace('.pdf','.html'),html);
  }
}

const DIRECT='Caisse directe';
const collectorOf=p=>p.collector||DIRECT;
function collectorOpts(s){
  const names=staffNames();if(!ME.isAdmin&&ME.name&&!names.includes(ME.name))names.push(ME.name);
  const def=ME.isAdmin?DIRECT:(names.includes(ME.name)?ME.name:(s&&s.seller)||DIRECT);
  return[DIRECT,...names].map(n=>`<option ${n===def?'selected':''}>${esc(n)}</option>`).join('');
}
function cashFigures(){
  const P=pays().filter(p=>p.status!=='annulé'&&p.method==='Espèces');
  const direct=P.filter(p=>collectorOf(p)===DIRECT).reduce((a,p)=>a+p.amount,0);
  const remits=S.remittances.reduce((a,r)=>a+r.amount,0);
  const exp=expActive().filter(e=>(e.method||'Espèces')==='Espèces').reduce((a,e)=>a+e.amount,0);
  const names=new Set([...staffNames(),...P.map(collectorOf).filter(n=>n!==DIRECT),...S.remittances.map(r=>r.name)]);
  const emp=[...names].map(n=>{const c=P.filter(p=>collectorOf(p)===n).reduce((a,p)=>a+p.amount,0);const r=S.remittances.filter(x=>x.name===n).reduce((a,x)=>a+x.amount,0);return{name:n,cash:c,remitted:r,due:c-r}}).sort((a,b)=>b.due-a.due);
  return{direct,remits,exp,theo:direct+remits-exp,emp};
}

const csvCell=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function exportData(kind){
  const P=pays(),now=today();
  if(kind==='ventes')return[['Facture','Date','Client','Téléphone','Vendeur','Chef','Type','Total','Payé','Reste','Statut']].concat(allSales().map(x=>[ref(x.s),x.s.date,x.c?x.c.name:'',x.c?x.c.phone||'':'',sellerOf(x.s),chiefOf(x.s),x.s.type==='credit'?'Crédit':'Comptant',x.s.total,x.st.paid,x.st.balance,x.st.status]));
  if(kind==='paiements')return[['Reçu','Date','Facture','Client','Montant','Moyen','Référence','Encaissé par','Statut']].concat(P.sort((a,b)=>a.date.localeCompare(b.date)).map(p=>{const s=byId(S.sales,p.saleId),c=byId(S.clients,p.clientId);return[p.number,p.date.slice(0,10),s?ref(s):'',c?c.name:'',p.amount,p.method,p.ref||'',collectorOf(p),p.status]}));
  if(kind==='echeances')return[['Facture','Client','Téléphone','Tranche','Date','Montant prévu','Reste à payer','Statut']].concat(allSales().flatMap(x=>x.st.sched.map(e=>[ref(x.s),x.c?x.c.name:'',x.c?x.c.phone||'':'',e.n+'/'+x.st.sched.length,e.due,e.amount,e.balance,{payee:'Payée',retard:'En retard',aujourdhui:"Aujourd'hui",avenir:'À venir'}[e.status]])));
  if(kind==='clients'){const A=allSales();return[['Nom','Téléphone','Ville','Adresse','Repère','Position','Reste dû']].concat(S.clients.map(c=>[c.name,c.phone||'',c.city||'',c.address||'',c.landmark||'',c.geo||'',A.filter(x=>x.s.clientId===c.id).reduce((a,x)=>a+x.st.balance,0)]))}
  return[['Date','Catégorie','Motif','Montant','Statut']].concat(S.expenses.map(e=>[e.date,e.category||'',e.reason||'',e.amount,e.cancelled?'Annulée':'Valide']));

function readImage(file,max=360){
  return new Promise((ok,ko)=>{
    const fr=new FileReader();fr.onerror=()=>ko(new Error('lecture'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>ko(new Error('image'));
      im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
        const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        ok(c.toDataURL('image/jpeg',0.72))};
      im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function openVoices(){
  const canRec=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  const o=sheet('Voix en wolof','',(el,o)=>{o.refresh=draw});
  let rec=null,recKey='';
  function draw(){
    setBody(o,`<p class="note" style="margin-top:0">Enregistrez chaque phrase avec votre voix, une seule fois (5 à 10 secondes). Elle sera jouée à vos employés à chaque étape de la vente guidée.</p>

    ${VOICES.map(([k,t,s])=>{const v=voiceDoc(k);return `<div class="vrow"><b>${esc(t)}</b><p>À dire en wolof : « ${esc(s)} »</p><div class="acts"><button type="button" class="btn sm ${recKey===k?'rec':''}" data-r="${k}" ${canRec?'':'disabled'}>${recKey===k?'Arrêter':(v?'Réenregistrer':'Enregistrer')}</button><button type="button" class="btn sm sec2" data-p="${k}" ${v?'':'disabled'}>Écouter</button><button type="button" class="btn sm danger" data-d="${k}" ${v?'':'disabled'}>Effacer</button></div></div>`}).join('')}

    o.el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>playVoice(b.dataset.p));
    o.el.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const v=voiceDoc(b.dataset.d);if(v){await put('settings',v.id,{key:b.dataset.d,url:'',at:Date.now()});if(!DB){S.settings=S.settings.filter(x=>x.id!==v.id);lsPut('settings')}toast('Voix effacée');draw()}});
    o.el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>toggleRec(b.dataset.r));
  }
  async function toggleRec(k){
    const err=$('#verr',o.el);err.textContent='';
    if(rec&&recKey===k){rec.stop();return}
    if(rec){return}
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true});
      const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];const mt=types.find(t=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
      const r=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});const ch=[];
      r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
      r.onstop=async()=>{
        st.getTracks().forEach(t=>t.stop());clearTimeout(tm);rec=null;recKey='';
        const blob=new Blob(ch,{type:r.mimeType||mt||'audio/webm'});
        if(blob.size<800){err.textContent='Enregistrement trop court. Réessayez.';draw();return}
        if(blob.size>260000){err.textContent='Enregistrement trop long (15 secondes au maximum).';draw();return}
        const url=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(blob)});
        await put('settings','voice_'+k,{key:k,url,at:Date.now()});toast('Voix enregistrée');draw();
      };
      r.start();rec=r;recKey=k;draw();
      var tm=setTimeout(()=>{try{r.stop()}catch(e){}},15000);
    }catch(e){err.textContent='Le micro est refusé. Autorisez-le dans les réglages du navigateur, puis réessayez.'}
  }
  draw();
}

/* Dictée du nom : le téléphone écoute puis écrit le nom (Chrome, internet nécessaire). Le nom reste modifiable au clavier. */
const speechAPI=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
function listenName(btn,onText,onErr){
  const SR=speechAPI();if(!SR){if(btn.onfatal)btn.onfatal('absent');else onErr('La voix n\'est pas disponible sur ce téléphone. Écris le nom.');return}
  if(btn._rec){try{btn._rec.stop()}catch(e){}return}
  const sp=btn.querySelector('span'),lab=sp?sp.textContent:'',setL=t=>{if(sp)sp.textContent=t};
  const r=new SR();r.lang='fr-FR';r.interimResults=false;r.maxAlternatives=1;btn._rec=r;onErr('');
  r.onstart=()=>{btn.classList.add('rec');setL('Je t\'écoute…')};
  r.onresult=e=>{const t=((e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||'').trim();if(t)onText(t.replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()))};
  r.onerror=e=>{
    const k=e.error;
    if(k==='no-speech'||k==='aborted'){onErr(k==='no-speech'?'Rien entendu. Touche le micro et dis le nom.':'');return}
    if(k==='not-allowed'){onErr('Micro refusé. Autorise-le dans les réglages du navigateur.');return}
    if(btn.onfatal)btn.onfatal(k);else onErr(k==='network'?'La voix demande internet. Écris le nom.':'Voix indisponible. Écris le nom.');
  };
  r.onend=()=>{btn._rec=null;btn.classList.remove('rec');setL(lab||'Dire le nom')};
  try{r.start()}catch(e){btn._rec=null;btn.classList.remove('rec');if(btn.onfatal)btn.onfatal('start');else onErr('Voix indisponible. Écris le nom.')}
}

        try{
          const st=await navigator.mediaDevices.getUserMedia({audio:true});
          const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];const mt=types.find(t=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
          const r=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});const ch=[];let tm;
          r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
          r.onstop=async()=>{
            st.getTracks().forEach(t=>t.stop());clearTimeout(tm);mr=null;mic.classList.remove('rec');lbl('Dire le nom');
            const blob=new Blob(ch,{type:r.mimeType||mt||'audio/webm'});
            if(blob.size<800){err('Trop court. Touche le micro et dis le nom.');return}
            if(blob.size>120000){err('Trop long. Dis seulement le nom.');return}
            g.nameAudio=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(blob)});
            const au=$('#gau',o.el);if(au){au.src=g.nameAudio;au.hidden=false}
            err('');note('Voix gardée. Touche la coche verte.');
          };
          r.start();mr=r;mic.classList.add('rec');lbl('Arrêter');err('');tm=setTimeout(()=>{try{r.stop()}catch(e){}},6000);
        }catch(e){err('Micro refusé. Autorise-le dans les réglages du navigateur.')}
      }
      mic.onclick=()=>{if(recMode)recName();else listenName(mic,t=>{inp.value=t;err('');note('Nom écrit. Touche la coche verte, ou corrige-le.')},m=>err(m))};
      const gvo=$('#gvo',o.el);if(gvo)gvo.onclick=()=>openVoices();
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#go',o.el).click()}};
      const mk=async nm=>{
        const id=uid('c');const name=nm||('Client '+phoneShow(g.newPhone));
        const d={name,phone:g.newPhone,created:today(),agent:ME.id,incomplete:!nm};
        if(!nm&&g.nameAudio)d.nameVoice=g.nameAudio;
        try{await put('clients',id,d)}catch(e){err('Client non enregistré : '+String((e&&e.message)||e).slice(0,100));return}
        g.client={id,...d};g.nameAudio='';go('product');
      };
      $('#go',o.el).onclick=()=>{const nm=val(o.el,'gnm').trim();if(!nm&&!g.nameAudio){err('Dis le nom avec le micro, ou écris-le.');return}mk(nm)};
      $('#gx',o.el).onclick=()=>mk('');
    }else if(st==='price'){
      const c=cat();
      shell(`<div class="gd-sub">Prix de 1 ${esc(prod().name)}</div><div class="gd-big" id="gv">${fmtN(c)}</div><div class="gd-sub" id="gn" style="opacity:.8">Valide pour garder ce prix, ou tape un autre prix</div>${keypad(9)}`);
      bindKeys(9,()=>{$('#gv',o.el).textContent=fmtN(g.buf?Number(g.buf):c);$('#gn',o.el).textContent=g.buf&&Number(g.buf)!==c?'Prix changé (normal : '+fmtN(c)+')':'Valide pour garder ce prix, ou tape un autre prix'},()=>!g.buf||Number(g.buf)>0,()=>{g.price=g.buf?Number(g.buf):0;next()});
    }else if(st==='product'){
      const L=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name));
      shell(`<div class="tiles">${L.map(p=>{const q=stockOf(p.id);return `<button type="button" class="tile ${q<=0?'dim':''}" data-p="${p.id}" ${q<=0?'disabled':''}>${p.img?`<img src="${p.img}" alt="">`:`<div class="tph" aria-hidden="true">${esc(p.name.trim().charAt(0).toUpperCase())}</div>`}<b>${fmtN(p.price)}</b><small>${esc(p.name)}</small></button>`}).join('')||'<div class="empty">Aucun produit. Le dirigeant doit en ajouter.</div>'}</div>`);
      o.el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{g.pid=b.dataset.p;g.qty=1;g.price=0;go('qty')});
    }else if(st==='qty'){
      const p=prod(),mx=stockOf(p.id);
      shell(`<div class="tile" style="cursor:default">${p.img?`<img src="${p.img}" alt="">`:''}<small>${esc(p.name)}</small></div><div class="qty"><button type="button" id="qm" aria-label="Moins">−</button><b id="qv">${g.qty}</b><button type="button" id="qp" aria-label="Plus">+</button></div><div class="gd-sub">En stock : ${mx}</div><button type="button" class="gd-ok" id="go" aria-label="Valider">${gsvg('ok')}</button>`);
      $('#qm',o.el).onclick=()=>{g.qty=Math.max(1,g.qty-1);$('#qv',o.el).textContent=g.qty};
      $('#qp',o.el).onclick=()=>{g.qty=Math.min(mx,g.qty+1);$('#qv',o.el).textContent=g.qty};
      $('#go',o.el).onclick=next;
    }else if(st==='type'){
      const p=prod();
      shell(`<div class="tiles" style="grid-template-columns:1fr"><button type="button" class="tile huge" data-t="cash">${gsvg('cash')}<div class="n">${fmtN(p.price*g.qty)}</div><small>Comptant</small></button><button type="button" class="tile huge" data-t="credit">${gsvg('cal')}<div class="n">${fmtN((p.creditPrice||p.price)*g.qty)}</div><small>Crédit</small></button></div>`);
      o.el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{g.type=b.dataset.t;g.months=0;g.dep=0;g.price=0;next()});
    }else if(st==='months'){
      shell(`<div class="tiles">${[1,2,3,4].map(n=>`<button type="button" class="tile huge" data-m="${n}">${gsvg('cal')}<div class="n">${n}</div></button>`).join('')}</div>`);
      o.el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{g.months=Number(b.dataset.m);next()});
    }else if(st==='deposit'){
      const t=total();
      shell(`<div class="gd-sub">Total ${fmtN(t)} FCFA</div><div class="gd-big" id="gv">0</div><div class="gd-err" id="ge"></div>${keypad(9)}`);
      bindKeys(9,()=>{$('#gv',o.el).textContent=fmtN(Number(g.buf||0));$('#ge',o.el).textContent=Number(g.buf||0)>=t?'Trop grand : le crédit doit avoir un reste.':''},()=>Number(g.buf||0)<t,()=>{g.dep=Number(g.buf||0);next()});
    }else if(st==='method'){
      shell(`<div class="tiles" style="grid-template-columns:1fr"><button type="button" class="tile huge c-esp" data-m="Espèces">${gsvg('cash')}<b style="font-size:28px">Espèces</b></button><button type="button" class="tile huge c-wave" data-m="Wave"><b style="font-size:34px">Wave</b></button><button type="button" class="tile huge c-om" data-m="Orange Money"><b style="font-size:30px">Orange Money</b></button></div>`);
      o.el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{g.method=b.dataset.m;next()});
    }else if(st==='recap'){
      const p=prod(),t=total(),sch=g.type==='credit'?buildSchedule(t,g.dep,g.months,addMonths(today(),1),{m:1}):[];
      const payNow=g.type==='credit'?g.dep:t;
      shell(`<div class="gd-card"><div class="row2"><span>${esc(g.client.name)}</span><b>${g.qty} × ${esc(p.name)}</b></div><div class="tot2">${fmtN(t)} FCFA</div>
        ${g.type==='credit'?`<div class="row2"><span>Acompte</span><b>${fmtN(g.dep)}</b></div>${sch.map(e=>`<div class="row2"><span>${e.n}. ${fdate(e.due)}</span><b>${fmtN(e.amount)}</b></div>`).join('')}`:`<div class="row2"><span>Comptant</span><b>${esc(g.method)}</b></div>`}</div>
        <div class="gd-err" id="ge"></div><button type="button" class="gd-ok" id="go" aria-label="Valider la vente">${gsvg('ok')}</button><button type="button" class="gd-no" id="gx">Recommencer</button>`);
      $('#gx',o.el).onclick=()=>{g.client=null;g.pid='';g.type='';g.price=0;go('phone')};
      $('#go',o.el).onclick=async()=>{
        const ge=$('#ge',o.el),btn=$('#go',o.el);ge.textContent='';
        if(stockOf(p.id)<g.qty){ge.textContent='Stock insuffisant.';return}
        const B=books().filter(b=>b.open).sort((a,b)=>b.num-a.num);
        let bk=B.find(b=>b.chief===g.seller)||B[0],tel=bk?chiefTelOf(bk.num,bk.owner):'';
        if(bk&&!okTel(tel)){ge.textContent='Le téléphone du chef de la facture F'+bk.num+' manque. Appelle le dirigeant.';return}
        if(!bk){const sf=S.staff.find(x=>x.name===g.seller);tel=sf&&sf.phone||'';if(!ME.isAdmin||!okTel(tel)){ge.textContent='Aucune facture ouverte. Appelle le dirigeant.';return}}
        btn.disabled=true;
        let slot;const sid=uid('s'),num_=nextNumber('V');
        try{slot=await takePage(bk?bk.num:null,bk?bk.chief:g.seller,sid,tel,bk?bk.owner:(ME.id||''))}catch(e){console.warn('takePage',e);ge.textContent=whyFail(e);btn.disabled=false;return}
        const date=today(),u=unit(),lines=[{productId:p.id,name:p.name,qty:g.qty,price:u,listPrice:cat()}];
        if(u!==cat())await logAct('Prix modifié','F'+slot.f+'P'+slot.p+' · '+p.name+' : '+fmtN(cat())+' → '+fmtN(u));
        await put('sales',sid,{number:num_,date,clientId:g.client.id,agent:ME.id,byAdmin:ME.isAdmin,fnum:slot.f,page:slot.p,owner:slot.o,seller:g.seller,lines,total:t,type:g.type,deposit:g.type==='credit'?g.dep:0,months:sch.length||0,schedule:sch,created:new Date().toISOString(),guided:true});
        if(payNow>0)await put('payments',uid('y'),{number:nextNumber('R'),saleId:sid,clientId:g.client.id,amount:payNow,kind:g.type==='credit'?'acompte':'comptant',method:g.method,ref:'',collector:ME.isAdmin?DIRECT:g.seller,date,time:new Date().toISOString(),agent:ME.id,byAdmin:ME.isAdmin});
        await put('moves',uid('m'),{productId:p.id,qty:-g.qty,type:'vente',date,note:num_,agent:ME.id});
        g.ref='F'+slot.f+'P'+slot.p;g.sid=sid;g.step='done';draw();playVoice('done');
      };
    }else if(st==='done'){
      shell(`<div class="gd-done"><div class="chk">${gsvg('ok')}</div><div class="ref">${esc(g.ref)}</div></div><button type="button" class="btn" id="gv2">Voir la facture</button><button type="button" class="gd-ok" id="gn2" aria-label="Nouvelle vente">${gsvg('cash')}</button>`,{noback:true});
      $('#gv2',o.el).onclick=()=>{o.close();openInvoice(g.sid)};
      $('#gn2',o.el).onclick=()=>{o.close();openGuided()};
    }
  }
  go(g.seller?'phone':'seller');
}
function openSimpleSettings(){

    setBody(o,`<p class="note" style="margin-top:0">Version de l'application : ${APP_VER}.</p><p class="note">Pour les employés qui ne lisent pas : la vente se fait avec des photos, des chiffres et la voix du dirigeant en wolof.</p>
    <div class="card"><div class="tot"><span>Mode simple sur ce téléphone</span><b>${isSimple()?'Activé':'Désactivé'}</b></div>
    <div style="height:8px"></div><button class="btn" id="ts">${isSimple()?'Désactiver':'Activer'}</button></div>
    <label for="se">Employé qui utilise ce téléphone</label><select id="se"><option value="">Choisir…</option>${names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</select>

  }
  draw();
}
